[package]
name = "ironmaintd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "ironmaintd daemon: bootstraps the runtime, exposes MCP, drains on SIGTERM (PHASE-0B.md §66-§68)."

[lints]
workspace = true

# Configuration parsing lives in a library target so `tests/` can
# exercise it. The binary below is a thin startup sequence over it.
[lib]
name = "ironmaintd"
path = "src/lib.rs"

[[bin]]
name = "ironmaintd"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
debian = { path = "../../adapters/debian" }
fedora-stub = { path = "../../adapters/fedora-stub" }
ironmaint-adapter-api = { path = "../../crates/ironmaint-adapter-api" }
ironmaint-artifacts = { path = "../../crates/ironmaint-artifacts" }
ironmaint-debian-tool = { path = "../ironmaint-debian-tool" }
ironmaint-executor = { path = "../../crates/ironmaint-executor" }
ironmaint-mcp = { path = "../../crates/ironmaint-mcp" }
ironmaint-runtime = { path = "../../crates/ironmaint-runtime" }
ironmaint-store = { path = "../../crates/ironmaint-store" }
ironmaint-store-sqlite = { path = "../../crates/ironmaint-store-sqlite" }
ironmaint-synthetic-tools = { path = "../../crates/ironmaint-synthetic-tools" }
ironmaint-workspace = { path = "../../crates/ironmaint-workspace" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "signal", "net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Owns the `ironmaint-fixture` binary the daemon's `check.run`
# executes. A dev-dep so cargo builds it alongside these tests —
# without it, the fixture is whatever happens to be sitting in
# `target/`, which may be another platform's build.
ironmaint-fixture = { path = "../ironmaint-fixture" }
# The daemon's own tests drive it over a real socket, for the
# same reason the transport tests do: the claim under test is
# about the wire, and an in-process call proves nothing.
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
# 1C.2's source-analysis integration test reads the bound
# report artifact via `evidence.artifact.read`; the tool
# returns the bytes base64-encoded, and the test decodes
# them to parse the report JSON. The `base64` crate is
# already a transitive dep of the workspace (used by the
# MCP dispatcher for the same purpose), so this is a
# direct dev-dep that makes that dependency explicit at
# the test boundary.
base64 = { workspace = true }
