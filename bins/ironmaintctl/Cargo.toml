[package]
name = "ironmaintctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Operator CLI for IronMaint. Phase 0B ships only `rebuild-projections`; the runtime's command surface lands in 0B.13 (commit 4)."

[lints]
workspace = true

[dependencies]
ironmaint-core = { path = "../../crates/ironmaint-core" }
ironmaint-store = { path = "../../crates/ironmaint-store" }
ironmaint-store-sqlite = { path = "../../crates/ironmaint-store-sqlite" }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# The rebuild regression test drives the *real* `CreateJob` path to
# produce a log worth rebuilding. Hand-assembling the log is the
# mistake D-14 was written about, and a mock-backed suite cannot see
# the production symptom — `MockStore::put_projection` would agree
# with a fresh store about what the CAS token should be.
ironmaint-executor = { path = "../../crates/ironmaint-executor" }
ironmaint-runtime = { path = "../../crates/ironmaint-runtime" }
# The legacy-data half of the rebuild regression test matches on
# `JobEvent` to strip the activation event from a real log. The
# variant is what D-16 added, so the test that simulates a
# pre-fix database has to name the type that did not exist then.
ironmaint-state = { path = "../../crates/ironmaint-state" }
tempfile = { workspace = true }
url = { workspace = true }
