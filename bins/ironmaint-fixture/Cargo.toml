[package]
name = "ironmaint-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Fixture binary used by §101 synthetic E2E tests. Reads an ExecutionRequest JSON from stdin and emits an ExecutionRecord JSON on stdout."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ironmaint-fixture"
path = "src/main.rs"

[dependencies]
ironmaint-adapter-api = { path = "../../crates/ironmaint-adapter-api" }
ironmaint-executor = { path = "../../crates/ironmaint-executor" }
serde_json = { workspace = true }
time = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The resolver's tests plant synthetic binaries in a temp dir to
# exercise the rejection path, which cannot be reached through the
# real workspace artifact.
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "process", "io-util"] }
