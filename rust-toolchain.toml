[toolchain]
# Raised to 1.94.0 to match the MSRV floor of sqlx 0.9.0 (the runtime
# crate pinned in Cargo.toml and first consumed when ironmaintd opens
# the sqlite store). The previous floor (1.88.0) was set against rmcp
# 3.x in Phase 0B.9; sqlx 0.9 raised its floor to 1.94 and that became
# the binding constraint. Edition 2024 itself still only needs 1.85.
# Newer toolchains are supported; CI and contributors will resolve to the
# latest compatible stable automatically.
channel = "1.94.0"
components = ["rustfmt", "clippy", "rust-src"]
