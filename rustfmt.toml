edition = "2024"
max_width = 100
# Stable rustfmt options only. (Trailing-comma and imports-granularity knobs
# live on nightly.) Tune via per-file `#[rustfmt::skip]` if we need them
# later, or move to nightly rustfmt on demand.
use_small_heuristics = "default"
tab_spaces = 4
newline_style = "Auto"
