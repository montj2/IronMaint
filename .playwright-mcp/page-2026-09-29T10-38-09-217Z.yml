            - generic "Smart Headings" [ref=f1e1668]:
              - generic [ref=f1e1670]:
                - heading "M. William December 2019" [level=2] [ref=f1e1672]
                - generic [ref=f1e1673]:
                  - paragraph [ref=f1e1674]: Life doesn't necessarily get easier as you get older. Things are constantly changing. Even when you are not expecting it or wanting it. It was never my plan to return to college in my fifties. However, life throws challenges our way and we must adjust. I was laid off from my job this past summer.
                  - paragraph [ref=f1e1675]: I never expected that I would be in this position at this age; and it was a turning point. I could continue down the same path that was comfortable and familiar or try something new. I decided to venture out of my comfort zone and took it as an opportunity to further myself and my career options.
                  - paragraph [ref=f1e1676]: I am now enrolled in college and excited about my future. It’s all new and quite daunting, but I am looking toward the future; not living in the past.
                  - paragraph [ref=f1e1677]: This is my one life and I choose to be proactive and not be discouraged. It will not be easy and I will have to challenge myself daily. Who knows what will come of my efforts, but I believe I will be better off with more knowledge and new skills.
                  - paragraph [ref=f1e1678]: You are never too old to learn!!
                  - paragraph [ref=f1e1679]: M. William
          - generic [ref=f1e1683]:
            - generic "Smart Headings" [ref=f1e1686]:
              - generic [ref=f1e1688]:
                - heading "M. Her November 2019" [level=2] [ref=f1e1690]
                - generic [ref=f1e1691]:
                  - paragraph [ref=f1e1692]: Throughout my life, I was often alone and spent a lot of time observing the behaviors of the people around me. I analyzed closely what they thought and how they reacted to different situations. Oddly enough, I realized how alike we are, how basic life is, but also how dynamic. Humans have a large capacity for love, as well as cruelty; this could be the reason why our world appears corrupt. We constantly seek the superior, the artificial human, to guide us to the path of perfection. Unfortunately for some people, this desire is immeasurable to fill, yet others have nothing to fill.
                  - paragraph [ref=f1e1693]: "During my adolescence years, I struggled a lot with my identity: I wore the labels others put on me. Little did I know, I dug my grave deeper by keeping my voice shut away, this had let others live vicariously through me. But after learning that no matter what I changed of myself, there will always be those who appreciate me and those who do not. I embraced my will to live and my will to succeed in life. I came to truths with my identity after forgiving myself and knew deep down that I desired wisdom. The taste of overcoming is rejuvenating to my purpose in life."
                  - paragraph [ref=f1e1694]: Going to college will give me the knowledge to help others overcome their own hardships through engineering and creating new ideas with technology to help the environment, to spread awareness about social issues and solve world problems.
                  - paragraph [ref=f1e1695]: M. Her
            - generic "Photo" [ref=f1e1698]:
