              - generic [ref=f1e1017]:
                - heading "J. Radandt April 2022" [level=2] [ref=f1e1019]
                - generic [ref=f1e1020]:
                  - paragraph [ref=f1e1021]: "Growth isn’t an automatic process. It requires careful nourishment, adequate attention, and loving dedication. But even with all that, growth requires something that cannot be given: the willingness to improve. This will is something that I have had to search for within myself, and at times, I thought it might never be found. In my darkest moments, I thought that growth was impossible for me, or even more worryingly, that I had nothing to grow towards- that my life was a dead end. When I think of how powerful those thoughts were, to be here, now, seems nothing short of a miracle. I’ve found the will to grow, and now that I have it, I intend to grow beyond what ever could have seemed possible for me. I want to get an education in clinical psychology, to help others find that same will to grow even if they think it’s nowhere to be found. I have a unique insight as to how hard it can be to reach that, and as such, I believe it’s my responsibility to help others obtain what I have been fortunate enough to find. With this scholarship, that future that once seemed nonexistent is within reach. And really, what could be a more worthwhile way to use this scholarship than providing a way for others to find their own courage to grow?"
                  - paragraph [ref=f1e1022]: J. Radandt
          - generic [ref=f1e1026]:
            - generic "Smart Headings" [ref=f1e1029]:
              - generic [ref=f1e1031]:
                - heading "H. Carlson March 2022" [level=2] [ref=f1e1033]
                - generic [ref=f1e1034]:
                  - paragraph [ref=f1e1035]: What does it mean to grow? The Hana two years ago would say “It means to always be the best at everything and always saying yes to anything. I should take on every project, assignment, activity, and hobby and perform it at 100%. Growing means that I am adding more things to my plate”. This way of thinking is misinformed and is rooted in capitalism.
                  - paragraph [ref=f1e1036]: I told myself that I could never make a mistake, and can only show the final product. I thought sharing the process of how I got there, would be a weakness. In dance- it is my art form- they say that it is not just about arriving in the position but the beauty comes from how you got there. This makes me reflect on what I want my journey to look like, and where do I want to go? The Hana two years ago would say “it is to push through no matter what and set my needs as a human aside”. In the present day, I would say that “my growth is not based on what I can produce for the world. I believe that growing includes rest. It includes listening to your body and what it needs and not comparing it to the needs of others”. To be able to acknowledge, reflect, and change my mindset about an issue that is deeply ingrained in our society is growth that I am personally proud of.
                  - paragraph [ref=f1e1037]: H. Carlson
