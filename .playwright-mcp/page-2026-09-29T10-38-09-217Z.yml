                - heading "M. Haklidir February 2021" [level=2] [ref=f1e1345]
                - generic [ref=f1e1346]:
                  - paragraph [ref=f1e1347]: One of the most debated topics in America is how to provide affordable healthcare to the masses. While many focus on accessible health insurance, I believe the answer lies in accessible healthcare providers. With this scholarship, I could continue my training to become a nurse practitioner and provide attainable medical services to underserved communities. My grandparents relied on home remedies to treat any ailment my brother and I developed. This is when my passion for medicine first took form.
                  - paragraph [ref=f1e1348]: Minimal medical care was not a concern until my grandfather went to the hospital for severe stomach problems. These were the result of Colon Cancer. Because my grandfather had not been to the doctor in years, the flare-up was highly aggressive. When I decided to go to college, I knew I wanted to help people like my grandfather. I chose the path to become a nurse practitioner because I can practice medicine without charging a fortune for my services.
                  - paragraph [ref=f1e1349]: Nurse practitioners are particularly beneficial in rural communities where hospitals and doctors are limited or non-existent. Being an honor student and going above and beyond for my goals, regardless of my financial crisis. I am grateful to be considered for this scholarship opportunity, and should I be selected, I will use it to advance my medical education.
                  - paragraph [ref=f1e1350]: M. Haklidir
          - generic [ref=f1e1354]:
            - generic "Smart Headings" [ref=f1e1357]:
              - generic [ref=f1e1359]:
                - heading "R. Doty January 2021" [level=2] [ref=f1e1361]
                - generic [ref=f1e1362]:
                  - paragraph [ref=f1e1363]: I was attracted to this scholarship because of its name and the meaning behind it. I know from experience; that a little bit of courage can go a long way! As a first-generation high school graduate, it has taken a lot of courage for me to use my education as a way break my family’s cycle of generational poverty.
                  - paragraph [ref=f1e1364]: My motivation is to not only provide a stable life for my own family, but to also follow my passion of helping at-risk youth break their negative family life cycles as well. My career and educational goals are extremely valuable to me. I’m aware that I can only accomplish these goals by earning a bachelor’s degree and pursuing a respectable career in my desired field of Human Services.
                  - paragraph [ref=f1e1365]: Being awarded the Courage to Grow Scholarship would be a true blessing to me. The financial assistance would help me fulfill my dream of becoming a college graduate, and get me one step closer to helping others find the courage to follow their own dreams.
                  - paragraph [ref=f1e1366]: R. Doty
