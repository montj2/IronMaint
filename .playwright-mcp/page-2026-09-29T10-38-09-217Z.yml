            - generic "Smart Headings" [ref=f1e479]:
              - generic [ref=f1e481]:
                - heading "E. Fotta February 2024" [level=2] [ref=f1e483]:
                  - generic [ref=f1e484]: E. Fotta
                  - generic [ref=f1e485]: February 2024
                - generic [ref=f1e487]:
                  - paragraph [ref=f1e488]: Nurses have always been role models to me. A nurse is willing to take care of people in their worst state and can do it with compassion, care, and a smile on their face. So, when I was in ninth grade and my sister was admitted to the Children’s Hospital of Philadelphia for her cardiac condition, sitting at her bedside provided me an unusual opportunity for growth and learning, even though I didn’t know it at the time. The CHOP nurses knew that my sister is a special girl and inspired her to push through. The warmth that turned my girl from a sick patient back into the vibrant person she is inside is the reason that I, too, want to dedicate my life to nursing.
                  - paragraph [ref=f1e489]: Since then, I have developed a strong passion for my career goal. This has called for a lot of change in my life. Science has overtaken my school schedule. My nights are spent alongside registered nurses, caring for children at a local daycare. Everything I do is in preparation for the day I can step into a healthcare facility, like the one my sister was in years ago, as a caring nurse myself. Now all I need is the degree and the financial support to get me there. I appreciate your consideration and would be honored to receive this scholarship.
                  - paragraph [ref=f1e490]: E. Fotta
          - generic [ref=f1e494]:
            - generic "Smart Headings" [ref=f1e497]:
              - generic [ref=f1e499]:
                - heading "O. Vargas January 2024" [level=2] [ref=f1e501]:
                  - generic [ref=f1e502]: O. Vargas
                  - generic [ref=f1e503]: January 2024
                - generic [ref=f1e505]:
                  - paragraph [ref=f1e506]: Being a student from Yakima Valley with a background in agriculture my passion for computer science comes from my desire to bridge the gap between farming methods and modern technology. Growing up in a community that values work and resilience I have come to understand the importance of innovation in overcoming challenges. My goal is to apply the principles of computer science to create efficient solutions for the sector ultimately improving productivity and sustainability in communities like mine. This scholarship holds significance for me as it not only provides financial support but also signifies belief in my ability to merge my cultural heritage with technological innovation. It will help alleviate the burden of pursuing education allowing me to focus on developing the necessary skills to bring about meaningful change in the agricultural industry through technology. By supporting my education in computer science this scholarship will enable me to contribute to an area that is often overlooked when it comes to advancements ensuring that farming communities are not left behind in this age. I am fully committed to making the most of this opportunity by utilizing my education for the benefit of both my field of study and my community.
                  - paragraph [ref=f1e507]: O. Vargas
            - generic "Photo" [ref=f1e510]:
              - figure [ref=f1e512]:
                - img "A man standing in front of some cars" [ref=f1e514]
          - generic [ref=f1e518]:
