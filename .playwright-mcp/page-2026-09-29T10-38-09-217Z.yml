            - generic "Smart Headings" [ref=f1e1146]:
              - generic [ref=f1e1148]:
                - heading "I.Owczarzak OCTOBER 2021" [level=2] [ref=f1e1150]
                - generic [ref=f1e1151]:
                  - paragraph [ref=f1e1152]: "Throughout middle school, I was a book judged by its cover. People jeered at my unconventional dust cover. I escaped into books so frequently, punishments included current reading escapades being hidden from my sight. Although I read often, my youth reading adventures were spent with ignorance. I used novels as my numbing agent, a portal from a dreadful reality. Happy, blissful books were the only ones near my repertoire. Bubbly, carefree plots transferred joyful emotion into my personal life, changing my views on classmates. Unable to escape the villains gawking at me as I crossed the lunchroom, I imagined the only solution was to redesign my cover. I adorned an identical jacket to any other. Slowly I transformed into a reader’s worst nightmare: a classic, appealing cover on a hollow, boring book."
                  - paragraph [ref=f1e1153]: My perspective shifted after I read Marie Lu’s, Champion; for a reading contest at school. Upon its completion, I was sprawled on the floor of my bedroom crying. The conclusion encapsulates Day and June, love interests, as they lose each other due to near death and memory loss. A closing scene for Marie Lu’s book opened a new chapter in my reading career. Soon after, I slowly shed my built-up facade from middle school and returned to dressing in a cover that I appreciated, realizing that content superseded aesthetics. If people couldn’t look past my cover and into my content they put down my book too early.
                  - paragraph [ref=f1e1154]: I.Owczarzak
          - generic [ref=f1e1158]:
            - generic "Smart Headings" [ref=f1e1161]:
              - generic [ref=f1e1163]:
                - heading "J.Ipock September 2021" [level=2] [ref=f1e1165]
                - generic [ref=f1e1166]:
                  - paragraph [ref=f1e1167]: I have killed a man. I killed a kind but ignorant man who chose not to work for what he believed in but rather put his trust in delusional faith.
                  - paragraph [ref=f1e1168]: I was this man a couple of years ago, struggling in school, struggling in soccer, and struggling at home. I believed I could achieve anything but faltered when asked how I would obtain said achievements, thus my goals often landed me knee-deep in the water of failures whose existence I refused to accept. It wasn't until I was bullied and harassed that reality was cast down upon me like an angelic light. The people that tore my dreams to pieces; they unveiled how much harder I needed to work to even approach my goals.
                  - paragraph [ref=f1e1169]: That day I buried my old self, adopting new beliefs and a much harsher view of life. Ultimately, to say I deserve the scholarship is wrong, as deserve is a deceiving word that instills false hope, however, this scholarship would provide a lot for me and I would use it well. Today I am 5th in my class, 4.0 GPA, President of Science NHS, and NHS, and play varsity and club soccer.
                  - paragraph [ref=f1e1170]: My story is true.
                  - paragraph [ref=f1e1171]: J. Ipock
            - generic "Photo" [ref=f1e1174]:
              - figure [ref=f1e1176]:
