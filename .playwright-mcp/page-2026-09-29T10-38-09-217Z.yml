            - generic "Smart Headings" [ref=f1e1058]:
              - generic [ref=f1e1060]:
                - heading "J. Estrellas FEBRUARY 2022" [level=2] [ref=f1e1062]
                - generic [ref=f1e1063]:
                  - paragraph [ref=f1e1064]: I felt cold–my hands blue; as if I had stuck them in the snow for hours, were shaking like crazy. My heart was beating out of my chest. My anxiety went through the roof. Hysterical, I rushed through the Emergency Room, wandering and desperately looking for anyone to help me. Finally, what felt like hours, a Registered Nurse took me in. I could not recall her name, however, I do remember her mother-like care. As she placed a nebulizer on me, I could almost hear the shakiness in her voice as she repeated, “Deep breaths”.
                  - paragraph [ref=f1e1065]: Nurses play an essential role in our society. They have to walk through tears and blood every day, treat any patient they encounter, give orders, and administer medications, all while having a smile on their face. We often underestimate nurses and their capabilities, but we do not really know what they go through on a daily basis. To me, they are heroes. The nurse that cared for me is a hero.
                  - paragraph [ref=f1e1066]: As a first-generation college student and honor student, I will continue to push myself toward success to pursue my career in Nursing. In that process, I hope to become an inspiration to my family, friends, and others along the way, just like how the registered nurse who treated me at the hospital inspired me.
                  - paragraph [ref=f1e1067]: Thank you for your time and consideration.
                  - paragraph [ref=f1e1068]: J. Estrellas
          - generic [ref=f1e1072]:
