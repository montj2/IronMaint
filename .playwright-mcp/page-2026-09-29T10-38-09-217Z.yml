                  - generic [ref=f1e378]: June 2024
                - generic [ref=f1e380]:
                  - paragraph [ref=f1e381]: I have always had a passion for learning. Growing up at the bottom of the food chain in a family of five kids, I was mesmerized by what I believed then to be the erudition of my older siblings. Peering over their shoulder and glancing at their worksheets of complex mathematical equations with not only numbers, but letters, the long words strung together that I couldn't even begin to pronounce, and don't get me started on the DNA models they worked on for what seemed to be an eternity. My childhood was centered around these daily interactions that fueled my passion for knowledge.As I got older, and found myself in the presence of these subjects, I began to see the simplicity of them. What I once saw as impossible, became worksheets that proved to be thrilling. This timeline opened up my eyes to the idea that while knowledge is vast and incomprehensible at the moment, as long as you attempt to understand and dive into the uncertainty of the future, the answers will come.
                  - paragraph [ref=f1e382]: This scholarship will be the fuel that catapults me into the great unknown. It will give me the means to capture the endless information that is thrown at me while always being hungry for more. I hope that my passion for learning will inspire society to delve into solving the great world problems, but we all must start somewhere, and for me, it starts with this scholarship.
                  - paragraph [ref=f1e383]: A. Mujica
          - generic [ref=f1e387]:
