            - generic "Smart Headings" [ref=f1e2137]:
              - generic [ref=f1e2139]:
                - heading "L. Wikner April 2018" [level=2] [ref=f1e2141]
                - generic [ref=f1e2142]:
                  - paragraph [ref=f1e2143]: I am a dreamer. A dreamer terrified to think that I have the opportunity to make a life-altering choice. Terrified to follow a risky path. Whatever path I take will lead me down a different road. It kills me to not know where a road will take me. I need to know that I will succeed. I want to be proud of my life. I do not want to find myself in four years saddled with regret and debt. I need help. I need the courage to take the necessary leap. I can do it; I know I can, but I need help and faith.
                  - paragraph [ref=f1e2144]: I am so tired of fear; so tired of uncertainty. Do you know how desperately I have clawed my way to be in this position? Can you feel my hunger? I have so much to give, so much to lose. It is this incongruity that strikes fear inside of my soul. But, I know with support and love I can do what is right, good, and pure. I have six siblings living on one income in one of the most expensive areas in the country. They inspire me and encourage me to fight for what I was not born with, but what I can be. Please, help me dream. I have dedicated myself to academia. I will never stop learning or seeking knowledge and the means to put myself in the best position to help others.
                  - paragraph [ref=f1e2145]: L. Wikner
          - generic [ref=f1e2149]:
            - generic "Smart Headings" [ref=f1e2152]:
              - generic [ref=f1e2154]:
                - heading "S. Keller March 2018" [level=2] [ref=f1e2156]
                - generic [ref=f1e2157]:
                  - paragraph [ref=f1e2158]: My family lives rural and remote. During 8 months of “winter” we heat our home with wood my family gathers each summer from lands with dead-standing trees needing cut to reduce forest fires. My mom rolls and flips heavy logs out of the forests for my dad to saw and my brother to split. I load our truck and help stack 8 cords each year. On nights when clear stars mean temperatures will fall below zero, our home grows very cold overnight as the logs in our stove fade into ashes before we set a morning fire. Feeling that cold makes me appreciate the rigorous planning and all the teamwork that brought warmth to our lives when we need it most.
                  - paragraph [ref=f1e2159]: I know my friends in town enjoy homes where they set a thermostat and enjoy heat they didn’t have to work for. Their parents may completely pay for their schools, too.
                  - paragraph [ref=f1e2160]: My family lacks the resources to pay for 4 years of college or take on loans. I feel different from my friends, but I realize that having the courage to deal with life’s challenges makes me stronger. When I struggled with my academics, I had to develop strategies to help me learn. Financially; early and consistent savings and using our state’s Running Start program to earn a free AA degree while in high school has allowed me to dream I could possibly afford my Bachelor’s degree. Winning scholarships would secure that dream and make me warm all over.
                  - paragraph [ref=f1e2161]: S. Keller
            - generic "Photo" [ref=f1e2164]:
