            - generic "Smart Headings" [ref=f1e1857]:
              - generic [ref=f1e1859]:
                - heading "J. Bosley April 2019" [level=2] [ref=f1e1861]
                - generic [ref=f1e1862]:
                  - paragraph [ref=f1e1863]: I believe I embody the spirit of this scholarship award which seeks to recognize young scholars who are courageously committed to obtaining a college degree and attaining their goals. I have always prided myself on maintaining high grades and appreciating the excellent educational opportunities which have been afforded to me.
                  - paragraph [ref=f1e1864]: One of my greatest personal strengths is determination and it has served to empower me with a good work ethic, ambition, positive focus, and the dedication necessary to successfully accomplish all my career and personal goals. My determined drive comes from my maternal grandfather, who was my substitute father and mentor. He passed away from cancer when I was 13, without the opportunity to share one last hug or meaningful talk. Accepting his loss was one of my biggest life challenges thus far, particularly because my mom and I lived with my grandparents following my parent’s divorce.
                  - paragraph [ref=f1e1865]: Receiving this scholarship would lessen the financial burden of receiving a higher education. My family makes many sacrifices in order to provide me with opportunities which enhance my life. However, like many other students, I still need to seek employment and student loans in order to afford college. If I were fortunate enough to be a recipient of this scholarship, it would offer me the ability to work less and focus more on studying, thus permitting me to fully appreciate the educational value offered at the collegiate level. Lessened financial burden equates to lessened stress.
                  - paragraph [ref=f1e1866]: Thank you for considering me for this scholarship.
                  - paragraph [ref=f1e1867]: J. Bosley
          - generic [ref=f1e1871]:
            - generic "Smart Headings" [ref=f1e1874]:
              - generic [ref=f1e1876]:
                - heading "G. Davis March 2019" [level=2] [ref=f1e1878]
                - generic [ref=f1e1879]:
                  - paragraph [ref=f1e1880]: In May of 2018 there was an ICE raid in Mount Pleasant, Iowa. This idyllic town where I grew up seemed to suddenly transform in to a hateful place before my eyes. This being exactly what I have been combatting throughout my years of classroom teaching and global-minded learning energized me to take action through work with the organization “IowaWINs”.
                  - paragraph [ref=f1e1881]: IowaWINs connects affected families with the resources and help they need to move through their family’s separation, loss and all-together trying times. Since June of 2018 I have been responsible for communicating with my assigned family to answer questions, connect them with local charitable events that can provide them with basic necessities, legal advice, job opportunities, and more.
                  - paragraph [ref=f1e1882]: As an ESL teacher, I do my best to use the afore-mentioned realizations and passion for action, acceptance and love in the classroom every day. After a day of teaching, I switch roles, as I am currently enrolled in the Masters in TESOL program at the University of Minnesota where I teach a TOEFL prep course and Research Writing to international students. Each of these positions allows me to demonstrate my leadership skills, work ethic and flexibility as I move from job to job, jumping from different populations and learning levels; sometimes all in one day!
                  - paragraph [ref=f1e1883]: Knowing that as a student and as a teacher attitude is everything, I do my best to arrive to my classes with an excitement for learning, a drive to succeed, and a heart full of empathy.
                  - paragraph [ref=f1e1884]: G. Davis
            - generic "Photo" [ref=f1e1887]:
              - figure [ref=f1e1889]:
                - img "A woman with long blonde hair wearing an orange shirt." [ref=f1e1891]
          - generic [ref=f1e1895]:
            - generic "Photo" [ref=f1e1898]:
              - figure [ref=f1e1900]:
                - img "A woman with long hair smiles for the camera." [ref=f1e1902]
            - generic "Smart Headings" [ref=f1e1905]:
              - generic [ref=f1e1907]:
                - heading "T. Walter February 2019" [level=2] [ref=f1e1909]
                - generic [ref=f1e1910]:
                  - paragraph [ref=f1e1911]: Courage is climbing Mount Everest, battling cancer, and skydiving. But courage is also those small steps. The ones that you might have never taken, like trying something new or taking a chance. Courage is sharing a part of yourself that is intrinsically vulnerable. Your heart, your personality, your soul. That part of you that is poured into everything you do.
                  - paragraph [ref=f1e1912]: Everything we do in life is based around courage. It determines whether we step outside, raise a hand in class, speak up against something, try for an internship, forgive someone, or apologize for a wrongdoing. Courage is stepping out of your comfort zone and being willing to experience what life has to offer. Being willing to do the things that scare us.
                  - paragraph [ref=f1e1913]: We grow into the people we were meant to be because courage gives us the opportunity. I often just go with the flow, do things only when I am pushed toward them, but lately there has been a spark of something else; a spark I am beginning to think of as courage. It is a yearning to get up and do something. To discover who I could be if I allowed courage to speak. Every day I am learning that the more I am led by that spark, the bigger it grows. It is becoming a flame that illuminates the path I can take. The path of courage.
                  - paragraph [ref=f1e1914]: T. Walter
          - generic [ref=f1e1918]:
            - generic "Smart Headings" [ref=f1e1921]:
              - generic [ref=f1e1923]:
                - heading "A. Capel January 2019" [level=2] [ref=f1e1925]
                - generic [ref=f1e1926]:
                  - paragraph [ref=f1e1927]: Growing up I learned different nourishes courage, adversity is the ultimate test of determination, and hardship is life strengthening me. I am a different thinker with ADHD, dyslexia, dysgraphia, CAPD and visual disturbances.
                  - paragraph [ref=f1e1928]: My life is like a glass of ice water. The rim of the glass represents overcoming to achieve my goals, the water, me with my differences, and the ice is my tenacity. Along my journey, as I keep adding ice, the water rises and cannot be held back. It continually spills over the rim. My differences cannot hold me back. With unending determination, I rise and overcome to achieve my goals.
                  - paragraph [ref=f1e1929]: "I process information differently than most people. I think and problem solve out of the box. Frankly, I try to destroy the box. School is very much in the box. I have weathered an educational system not built for me, that focused more on my weaknesses than it ever cared about my strengths. On my fantastic journey I found me, my voice and my courage to grow. I learned to self-advocate, to actively communicate with my teachers and ask for the things I need. I know my trials, they haven’t defined me but how I have responded to them has shaped me into an empathetic, fierce, compassionate, driven, perseverant, resilient person. I have realized what I put after I am: defines me. When I say I am different it is a blessing because my different sees the invisible, feels the intangible, and achieves the impossible."
                  - paragraph [ref=f1e1930]: A. Capel
