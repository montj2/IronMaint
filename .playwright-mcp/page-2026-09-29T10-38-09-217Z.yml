                - img "A woman with long hair wearing a blue sweater." [ref=f1e525]
            - generic "Smart Headings" [ref=f1e528]:
              - generic [ref=f1e530]:
                - heading "H.Carver December 2023" [level=2] [ref=f1e532]:
                  - generic [ref=f1e533]: H.Carver
                  - generic [ref=f1e534]: December 2023
                - generic [ref=f1e536]:
                  - paragraph [ref=f1e537]: When I turned four, I began a challenging journey that tested my strength and courage. Being diagnosed with Juvenile Rheumatoid Arthritis (JRA) taught me resilience and to look for the positives in adverse situations. From this experience, I learned to make sacrifices, overcome obstacles, and face fears. My diagnosis prepared me to confront challenges head-on, and that courage and hard work would always lead me through my biggest adversities. During my sophomore year, I encountered social and academic struggles, lost self-confidence, and feared my future. I was not only knocked off my academic pedestal, but I found myself distracted and submerged in an ocean of insecurities. I drew from the strength of my childhood, dealing with JRA to correct my mistakes, refocus, and work tirelessly to pursue my future goals. Service was the unexpected catalyst that helped me find the courage to grow and a path toward success. I found purpose through my high school Key Club, led with the most service hours, and was awarded Key Club President. Reflecting on my battle with JRA, I founded a chapter of “Letters-of-Love,” a club focused on creating handmade cards for children battling illnesses. My courage to grow is reflected in my academics, acts of service, leadership, and how I view myself. I realize that growth is not linear, it zig-zags, teaching us our biggest lessons. My experience helped me re-discover myself, find the courage to push forward, and reflect on my growth. I am honored to be considered for this scholarship.
                  - paragraph [ref=f1e538]: H.Carver
          - generic [ref=f1e542]:
            - generic "Smart Headings" [ref=f1e545]:
              - generic [ref=f1e547]:
                - heading "K. Van Alfen November 2023" [level=2] [ref=f1e549]:
                  - generic [ref=f1e550]: K. Van Alfen
                  - generic [ref=f1e551]: November 2023
                - generic [ref=f1e553]:
                  - paragraph [ref=f1e554]: Throughout our lives we face risks. These opportunities with unknown endings come in many forms, and many of us are familiar with the risks involved in moving, attending college, changing jobs, and even letting new people into our lives. Though these changes may evoke fears, they also make room for growth. They test and stretch us in ways that help us become the people we need to be. Our journeys make us stronger and help us to empathize with those who go through similar experiences.
                  - paragraph [ref=f1e555]: I've been through many challenges in my life. I grew up with a mother whose mental state continually changed at the drop off a hat, I've been bullied, abused, and recently dealt with health challenges. Nevertheless, I know these experiences have changed me for the better. They've helped me to become stronger, more patient, and caring. I understand the importance of kindness and love. I know there's always something brighter ahead. That no matter the depth of the darkness, it doesn't last forever. This is why I keep going. This is why I do not run from growth or life's challenges, because I know there's always something to learn.
                  - paragraph [ref=f1e556]: With this scholarship, I will have the assistance needed to continue my college education and keep growing. It will expand my mind and my ability to persevere. I know I have the courage and willpower to keep working towards the life I desire for myself and my future family, and this will help me do it.
                  - paragraph [ref=f1e557]: K. Van Alfen
