            - generic "Smart Headings" [ref=f1e1482]:
              - generic [ref=f1e1484]:
                - heading "D. Daniel August 2020" [level=2] [ref=f1e1486]
                - generic [ref=f1e1487]:
                  - paragraph [ref=f1e1488]: The Courage to Grow Scholarship provides an opportunity for me to reduce the cost of earning my education. I am determined not to allow financial burdens to prevent me from making an impact on the world. The economic support this scholarship will provide will not only fund my education, but in due time, it will be paid forward to increase the number of students who will be able to earn their education as I plan to create my own scholarship foundation when I become successful. Consequently, it is imperative that students like me, who are financially supported by a single-parent household, have the same educational opportunity as students who have the financial support of both parents.
                  - paragraph [ref=f1e1489]: Correspondingly, this has been a pivotal time in my life as an African American female, being a black woman, who moved from Florida to Atlanta, with my dad right when my high school journey was about to begin. Not only was I without my mom, but I lived with three other people in my Granny’s one-bedroom apartment (three people sleeping in the same bed). In the face of that admittedly challenging adversity, I showed no signs of drop-off in my academic performance. Quite the contrary, it actually provided me the foundation to be a better student who valued the importance of education as I saw it as my only way out of this hardship. I have been denied countless scholarships, but I still choose to persevere because giving up is not an option.
                  - paragraph [ref=f1e1490]: D. Daniel
          - generic [ref=f1e1494]:
            - generic "Smart Headings" [ref=f1e1497]:
              - generic [ref=f1e1499]:
                - heading "C. Brennan July 2020" [level=2] [ref=f1e1501]
                - generic [ref=f1e1502]:
                  - paragraph [ref=f1e1503]: At the age of 30 I decided to go back to school. The decision was not easy. I wasn’t sure I was capable of going to college. This was not due to any obvious self doubt; I told myself it was not the path for me and I worked and traveled instead. I grew into myself during the years away from school and what I know now is that I carried a sense of self lack and disempowerment around life and around academia. With systems of reward and success being male-centric; the seeds of doubt were planted in me as a young girl and I didn’t notice the brambles they grew into, blocking my path.
                  - paragraph [ref=f1e1504]: When I plunged into community college I was surprised to find that I excelled in my studies because I really wanted to learn and I began to find words and ideas for things I had thought about for years around social and ecological injustices. With growing confidence I found the courage to study art which I’ve done since I can remember. Art, I had been told, would never support me and was impractical. I have begun to see that pursuing art is my path toward contributing to a more just and loving world that I believe in, and this begins with completing my BFA. But I need help with this dream as the costs of going to school are solely my responsibility and so I ask to be considered for your generous scholarship.
                  - paragraph [ref=f1e1505]: C. Brennan
            - generic "Photo" [ref=f1e1508]:
              - figure [ref=f1e1510]:
                - img "A woman standing under a tree on top of a hill." [ref=f1e1512]
          - generic [ref=f1e1516]:
            - generic "Photo" [ref=f1e1519]:
              - figure [ref=f1e1521]:
                - img "A man with a shaved head and a blue shirt" [ref=f1e1523]
            - generic "Smart Headings" [ref=f1e1526]:
              - generic [ref=f1e1528]:
                - heading "T. Bullock June 2020" [level=2] [ref=f1e1530]
                - generic [ref=f1e1531]:
                  - paragraph [ref=f1e1532]: As a Jazz pianist, I have discovered the invaluable gift of my unique creative voice through music, which allows me to persevere through difficult times and express my perspective in society. One of the greatest attributes of music is that it gives a voice for people to tell their stories, especially those who may not otherwise have a platform. Through music, I hope to expose the deep-rooted systemic injustices in our nation’s history and raise our collective consciousness towards love and acceptance of one another.
                  - paragraph [ref=f1e1533]: Recently, I was honored to host a virtual “At Home” concert through the Nashville Jazz Workshop. Jazz music reflects the culture, strength, and ingenuity of the African-American people and I wanted to express that in my show. The set list included songs that speak to the history of injustice that plague our country.
                  - paragraph [ref=f1e1534]: The universality of music has given me the honor to serve a diverse group of people, including children in the inner city, people who have struggled with drug addiction, and most recently, the elderly at an assisted living facility. Through these experiences, I have seen, firsthand, the power of music to make a positive impact on a community.
                  - paragraph [ref=f1e1535]: This fall, I will audition for music conservatories. My goal is to be a professional jazz performer, composer, and educator. Your investment will enable me to gain the knowledge and skills to educate youth as well as create music that unifies, raises awareness, and inspires change for the social ills in our society.
                  - paragraph [ref=f1e1536]: T. Bullock
          - generic [ref=f1e1540]:
            - generic "Smart Headings" [ref=f1e1543]:
              - generic [ref=f1e1545]:
                - heading "J. Myers May 2020" [level=2] [ref=f1e1547]
                - generic [ref=f1e1548]:
                  - paragraph [ref=f1e1549]: I live in a small town. Most of the people here were born and raised here. Families stay for generations, they raise their kids and grandkids in the same place. They have childhood friends and ties to the community. All of these things give them a sense of belonging.
                  - paragraph [ref=f1e1550]: I, however, have not had that experience. I have grown up in three different states; Florida, Oklahoma, and Georgia. Each time I start to get settled somewhere I end up moving again.
                  - paragraph [ref=f1e1551]: This caused me to feel like an outsider and become very angry. I kept myself from getting invested in any place. I was so focused on what life could have been that I missed out on what it actually was. My own anger was my greatest obstacle.
                  - paragraph [ref=f1e1552]: One day, however, I made the deliberate decision to let go of my anger. I realized that I was holding myself back, and I would never grow if I continued this way. This was a difficult decision to make, but I am so glad I did. I now realize that new experiences should be embraced, not feared.
                  - paragraph [ref=f1e1553]: I believe that these experiences have shaped me into the person I am today. I now have a unique ability to not only adapt, but to thrive in new and challenging circumstances. It is for these reasons that I know I am well equipped for my next exciting journey, college. This scholarship would help me be able to enjoy that journey a little bit more.
                  - paragraph [ref=f1e1554]: J. Myers
            - generic "Photo" [ref=f1e1557]:
              - figure [ref=f1e1559]:
                - img "A woman with long hair and earrings smiling." [ref=f1e1561]
          - generic [ref=f1e1565]:
            - generic "Photo" [ref=f1e1568]:
              - figure [ref=f1e1570]:
                - img "A woman sitting on top of a wooden bench." [ref=f1e1572]
            - generic "Smart Headings" [ref=f1e1575]:
              - generic [ref=f1e1577]:
                - heading "N. Harling April 2020" [level=2] [ref=f1e1579]
                - generic [ref=f1e1580]:
                  - paragraph [ref=f1e1581]: I am unsure of everything. I am unsure of what to do today. I am unsure about what job I want to pursue. I am unsure of where I want to live. I am unsure if I can travel the world. I am unsure of everything. There is only one thing that I am sure of, I am sure that I need to go to college.
                  - paragraph [ref=f1e1582]: I value education. Without education the next generation of leaders would not be able to make necessary decisions. Whether those leaders are high school principals or the president of the United States, they need education. Education challenges our minds and pushes us to achieve what we are truly capable of. Without education society would have to start over and begin again.
                  - paragraph [ref=f1e1583]: I deserve this scholarship because I value the education college will offer me. I understand the impact that this scholarship could have on me and my life. I am ready to grow as a human and learn more about myself, the people around me, and the world. This scholarship will help me achieve my educational goals and set me on a path to becoming one of America’s future leaders.
                  - paragraph [ref=f1e1584]: N. Harling
          - generic [ref=f1e1588]:
            - generic "Smart Headings" [ref=f1e1591]:
              - generic [ref=f1e1593]:
                - heading "J. Craig March 2020" [level=2] [ref=f1e1595]
                - generic [ref=f1e1596]:
                  - paragraph [ref=f1e1597]: Courage is standing up for what is right, even if what is right is not what you want. Courage is setting aside differences and helping your neighbor like she is your sister. Courage is being brutally honest with yourself when you need to be told the bitter truth.
                  - paragraph [ref=f1e1598]: I try to be courageous for the kid in my first-period English class who is closeted like I was and does not know whether to laugh or not when kids in our class are using the word “fag” or “gay” in place of “stupid” or “dumb”. I try to be courageous when I worked on a congressional campaign in 2018 facing a tidal wave of prejudice while I focused on ensuring the voice of everyone, democrats, independents, and republicans were heard by doing mass voting registration drives. I try to be courageous for my mother who works so hard to put my brother and me through school, giving up so much in her life for us.
                  - paragraph [ref=f1e1599]: I can remember when my mom came home from her second job one night years ago. I looked at her as she hid her eyes from the cruel world with her hands only for a moment. She then pulled her hair back and got to work on homework with me as I was extremely dyslexic as a child and could not do it alone. She gives me the courage to grow. This scholarship merely helps ensure I have the money to do so in college.
                  - paragraph [ref=f1e1600]: J. Craig
            - generic "Photo" [ref=f1e1603]:
