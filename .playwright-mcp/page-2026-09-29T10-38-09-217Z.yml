                - generic [ref=f1e398]:
                  - paragraph [ref=f1e399]: Change isn’t something that has come easy to me, but without it I wouldn’t be the person I am today.
                  - paragraph [ref=f1e400]: "I recently just finished my freshman year of college. It started like many college journeys: moving away from home, rooming with strangers, and saying goodbye to mom and dad. However, the hardest part was realizing I had to make decisions on my own."
                  - paragraph [ref=f1e401]: It felt strange not having someone to guide me. All I had was myself. This freedom, while exhilarating, was also exhausting. Simple tasks like going to class, eating breakfast, and making new friends were difficult.
                  - paragraph [ref=f1e402]: Not to mention wrestling with questions of existential dread about what I was going to do with my life. As an undeclared student the feeling of anxiety around my studies only increased over time.
                  - paragraph [ref=f1e403]: I was worried about making the wrong decision and wasting my education on a degree that wasn’t right for me. This thinking kept me paralyzed but luckily, I decided to reach out for help.
                  - paragraph [ref=f1e404]: I went to my professor/academic advisor who helped me to realize that it isn’t about right or wrong. It is simply about taking a step forward in one direction. That advice gave me the courage to declare my major as English. Due to making that decision I found an area of study that I love.
                  - paragraph [ref=f1e405]: This generous Scholarship opportunity would help remove financial strain, enabling me to continue to be curious and grow not only as a college student but as an individual.
                  - paragraph [ref=f1e406]: A. Woodgeard
