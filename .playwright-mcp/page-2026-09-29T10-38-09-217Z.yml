                - generic [ref=f1e881]:
                  - paragraph [ref=f1e882]: Apartment clean? Check. Directions sent? Check. Hospitality attitude on? Check. I am an Airbnb host and this is how I started earning money to be able to attend college.
                  - paragraph [ref=f1e883]: When I was 12 years old, my parents thought a part time job would help me save money for college. We had a bunkhouse studio apartment that was attached to our home. My Airbnb business consisted of managing online reservations, ordering supplies, cleaning the apartment between guests, hospitality and managing finances.
                  - paragraph [ref=f1e884]: I was homeschooled but took dual credit courses in high school. I entered Oregon State University with a sophomore standing. Taking college classes during high school saved me thousands of dollars so I could keep saving for college.
                  - paragraph [ref=f1e885]: College is expensive to attend. Aside from the money I’ve earned from my Airbnb business, I worked at other jobs. I rode horses and cleaned two Airbnb rental homes for people, listed items on Craigslist for local clients, and in September of 2021, I picked up another part time job at TJ Maxx. I am currently a freshman attending Oregon State University (Cascades) in Bend, Oregon. The academics are challenging, but I'm learning new knowledge and skills and enjoying my Calculus and Biology classes.
                  - paragraph [ref=f1e886]: I deserve "The Courage to Grow Scholarship" because of my hard work the last 6 years to be able to attend college. Tuition, housing, and fees are expensive and any additional support is greatly appreciated. Thank you for considering me for your generous scholarship.
                  - paragraph [ref=f1e887]: K. Little
          - generic [ref=f1e891]:
            - generic "Smart Headings" [ref=f1e894]:
              - generic [ref=f1e896]:
                - heading "M. Barrientos September 2022" [level=2] [ref=f1e898]:
                  - generic [ref=f1e899]: M. Barrientos
                  - generic [ref=f1e900]: September 2022
                - generic [ref=f1e902]:
                  - paragraph [ref=f1e903]: Academics play an important role for my family, it is a way out of the life that we have been a long part of. My family has lived in poverty for most of their lives; it was not until recently that my father got a better job to help us out negligibly. Being raised in a family of minorities does not make it easy to receive a higher education. Being successful is a dream, but between a dream, there stands an obstacle, and this obstacle of mine is financial assistance. I wish to be the first person in my family to not only go to college, but also to become a doctor. I wish to one day generate wealth and give back; helping others is my dream. I have always vowed to put my community before myself. I too, want to build a student scholarship fund one day for those that are in need such as myself. If students are not receiving a way to be educated, then there is no future. I am one of these students who are not financially fit to become a doctor, yet it is a task that I am determined to complete no matter the adversity I will face. Affordable education is difficult to obtain, nonetheless, receiving this honor pledges that the future is in safe hands, for it will be given to someone who will give back to those in need.
                  - paragraph [ref=f1e904]: M. Barrientos
