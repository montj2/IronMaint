            - generic "Smart Headings" [ref=f1e1810]:
              - generic [ref=f1e1812]:
                - heading "O. Wyles June 2019" [level=2] [ref=f1e1814]
                - generic [ref=f1e1815]:
                  - paragraph [ref=f1e1816]: The title of this scholarship, “Courage to Grow”, expresses the profound belief that growing is a choice, and a courageous one at that. Although rain falls from the sky and the seeds in the ground will undoubtedly grow, humans are different. Life hands us rain, but it is our own courageous decision to use it to grow.
                  - paragraph [ref=f1e1817]: In 2015 I developed an autoimmune disorder called Alopecia that caused all of the hair on my body to fall out. As a girl in high school, image is everything, and this personal loss left me broken and fearful of what life would look like going forward. As I navigated through this complex time in my life, I could have chosen to hide myself away and let this debilitate me, or I could choose to embrace who I was and whilst doing so encourage others to do the same. I am proud to say that I chose the latter.
                  - paragraph [ref=f1e1818]: Since that loss 3.5 years ago, I have had the opportunity to be courageous every time that I walk out of the house with a bare head proclaiming that image isn’t everything, and being bald is beautiful. Not fitting into societal standards is still beautiful.
                  - paragraph [ref=f1e1819]: I believe that I should be awarded this scholarship because I am committed to growth. Through a multitude of personal experiences I have learned that embracing growth within yourself is a way to encourage it in others, and we could all use a little encouragement in our lives.
                  - paragraph [ref=f1e1820]: O. Wyles
          - generic [ref=f1e1824]:
            - generic "Smart Headings" [ref=f1e1827]:
              - generic [ref=f1e1829]:
                - heading "V. Simeon May 2019" [level=2] [ref=f1e1831]
                - generic [ref=f1e1832]:
                  - paragraph [ref=f1e1833]: I believe I am the right applicant for this scholarship because I understand how much courage it takes to reach my goals no matter what comes my way.
                  - paragraph [ref=f1e1834]: Being a child of two immigrant parents, opportunity to go to college was all my parents dreamed for their children. Although I was the second born of two children, I am the only one who decided to go to college and pursue my dream of becoming a pediatric nurse. In my senior year of high school an unfortunate event occurred in my life. I lost my mother to diabetes which had been giving her health complications for years. I took a fall and failed my senior year due to depression and stress. Despite people around me saying my chances of getting into college were low, I fought the fight and went back to high school to get my diploma. From getting my diploma to being in my last year of college today, I have the “Courage To Grow” because I know how it feels to go through hard times and have very few people believe in you and yet still succeed.
                  - paragraph [ref=f1e1835]: I deserve this scholarship because I am prepared to make a difference in other people’s lives. I will give back to the community and encourage other people to have the courage to grow in any situation or circumstance .This scholarship will help me finish my last year of undergrad and be the first in my family to receive a bachelor’s degree.
                  - paragraph [ref=f1e1836]: V. Simeon
            - generic "Photo" [ref=f1e1839]:
              - figure [ref=f1e1841]:
