                - heading "H. Lim December 2018" [level=2] [ref=f1e1955]
                - generic [ref=f1e1956]:
                  - paragraph [ref=f1e1957]: My cape flapping through the wind and my rosy cheeks stinging from the moisture in the clouds, I extended my arms with my small, grubby fists clenched as I flew over dozens of skyscrapers. Urgent to defeat the supervillain terrorizing my city, I activate my laser eyes until -
                  - paragraph [ref=f1e1958]: Rubbing my eyes, I snap back into reality and remove my cape - the plastic dry cleaning garment bag my parents use for their customers. I venture off in the store hearing the release of steam behind me. I see my father - sweat dripping down his cheeks - rapidly ironing in order to finish the large stack by the end of the day.
                  - paragraph [ref=f1e1959]: My parents sacrificed their livelihood in South Korea to grant happiness for their children - their sacrifice, a struggle hidden behind my father’s gentle smile every evening. Business was failing, yet my happiness was one thing my father strived to maintain. Years later, I found myself at the store more often - yet it became me rapidly ironing clothes and tagging garments.
                  - paragraph [ref=f1e1960]: Experiencing the hardships as an immigrant from a working-class background has grounded me as an individual - I have grown foundations, such as empathy, independence, and strength, which I carry into my everyday lifestyle.
                  - paragraph [ref=f1e1961]: Epitomizing the purpose of this scholarship, I can grow. Instead of fearing my future battles, I plan to embody them - striding toward them with my cape flapping through the wind, my fists clenched, and a new strength upon my shoulders.
                  - paragraph [ref=f1e1962]: H.Lim
