                  - generic [ref=f1e195]: March 2025
                - generic [ref=f1e197]:
                  - paragraph [ref=f1e198]: "Courage, for me, has always been a series of hesitant leaps, rather than confident strides. There’s that brief pause before every jump. Befriending someone new, giving a presentation in another language, even starting the college application process—each demanded a step into the unknown. One vivid leap was applying for a government youth service internship. The interview was nerve-wracking, the first day even more so. The blur of daunting tasks and older, unfamiliar faces prompted a moment of disbelief: how did I end up here? My introductions, delivered in a shaky voice, marked a turning point."
                  - paragraph [ref=f1e199]: "That audacious jump to something I didn't think I was qualified for opened me to a community I hadn't known, and a sense of purpose I didn't expect. I found a passion for service, one I hadn't realized was there. It wasn't just about the work itself: it was about the connections I made, and seeing with my own eyes the difference I could make. The courage to take risks showed me that I could adapt and thrive, wherever I was. It has led me down onto unfamiliar paths, allowing me to grow a little every time. Even now, taking the action to click the submit button on this application. So, though my courage may manifest itself as small, steady steps rather than a dramatic surge, it remains a constant force driving me forward into college and beyond."
                  - paragraph [ref=f1e200]: I.Chen
