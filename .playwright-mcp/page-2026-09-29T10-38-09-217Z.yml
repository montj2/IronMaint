              - generic [ref=f1e986]:
                - heading "L. Macias May 2022" [level=2] [ref=f1e988]
                - generic [ref=f1e989]:
                  - paragraph [ref=f1e990]: Choices. All important choices require courage. Meeting new people, going to college, serving in the military, playing sports, even writing an essay. Without courage to grow the world would go nowhere, nobody would go to the moon, nobody would want to be better. Fortunately everyone has a degree of courage, but not everyone cultivates it and stays determined to achieve their dreams.
                  - paragraph [ref=f1e991]: Death is around the corner for everyone, we must live our lives knowing this. But no great thing is created suddenly, so there is a fear that our hard work is for nothing. This is where courage comes in, sacrificing the present for a better future. There is no easy way from the earth to the stars.
                  - paragraph [ref=f1e992]: I have the courage and determination to achieve my goals. I want to create the stairs to the stars for humanity in the form of advancing space technology. Occasionally I’m distracted from my dream, but I have reminders of my purpose to keep me on track. What is your purpose, why were you yourself created? There is no shame in making an honest effort, do so and you will come closer to achieving your dreams and goals.
                  - paragraph [ref=f1e993]: I’m making an honest effort to fund my education, and I hope you are working towards your dreams as well.
                  - paragraph [ref=f1e994]: L. Macias
