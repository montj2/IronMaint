            - generic "Smart Headings" [ref=f1e1621]:
              - generic [ref=f1e1623]:
                - heading "S. Beleau February 2020" [level=2] [ref=f1e1625]
                - generic [ref=f1e1626]:
                  - paragraph [ref=f1e1627]: Growth is a concept I feel quite emphatically about. In my eighteen years, I have met adversity, and have learned to fight through it. Throughout grade school and my adolescence, I faced numerous bullies; therefore it was a continual struggle to even know what self-esteem felt like.
                  - paragraph [ref=f1e1628]: My lack of self-worth and need for inclusion made me an easy target; verbal and physical fights were daily occurrences during my childhood. In middle and high school, I let other people just as insecure as myself assign a low value to me, inviting negative thoughts that pervaded my mind like a virus.
                  - paragraph [ref=f1e1629]: "Finding my self-esteem was like the allegory of Plato’s Cave: I found light in a place I had not recognized as dark; I learned that my value was to be rightfully decided by myself. Seeing this light in the dark exhibited my most substantial growth within my high school career. I changed the things I said about myself to myself. Finally, my own future came into focus, no longer blurred by insecurities."
                  - paragraph [ref=f1e1630]: With self-esteem came maturity. Embodying the concept of self-esteem is what has made me the person I am today, one who is stronger than he once was. Not only did I grow out of weakness, but I have also learned along the way that growth is a necessity for those with ambitions such as myself; One who has degrees to earn, businesses to start, and places to see.
                  - paragraph [ref=f1e1631]: S. Beleau
          - generic [ref=f1e1635]:
            - generic "Smart Headings" [ref=f1e1638]:
              - generic [ref=f1e1640]:
                - heading "A. Stanger January 2020" [level=2] [ref=f1e1642]
                - generic [ref=f1e1643]:
                  - paragraph [ref=f1e1644]: I believe I am the epitome of the phrase, “Courage to Grow”. I don’t have a story like some, a story of loss or rejection or disease. My story is about how I had the courage to completely change my perspective.
                  - paragraph [ref=f1e1645]: My brother has autism and over the years, it has affected our family immensely. My parents dedicate a huge amount of time to him with doctor appointments, school meetings, medication research, counseling appointments and much more. Often, I used to find myself feeling like an afterthought to my parents. I felt like my family’s life revolved around my brother until one day I had the courage to grow by switching my perspective to the perspective of my brother. I had the courage to choose to see him as not a challenge in my life, but as an opportunity for growth. I had the courage to let go of the feeling that I was alone. I loved my brother before, but that day, I had the courage to love him unconditionally. Although this compassion and understanding may come easy to some, I consider it an amazing step of growth in my life.
                  - paragraph [ref=f1e1646]: Since then, I’ve been able to see not only my brother in a different light, but people all around me. Because I had the courage to grow, the courage to become a better person, I have found a happiness in which I couldn’t obtain any other way. My courage to face my hardships truly changed my life forever.
                  - paragraph [ref=f1e1647]: A. Stanger
            - generic "Photo" [ref=f1e1650]:
