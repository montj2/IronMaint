            - generic "Smart Headings" [ref=f1e2048]:
              - generic [ref=f1e2050]:
                - heading "B.McMillon August 2018" [level=2] [ref=f1e2052]
                - generic [ref=f1e2053]:
                  - paragraph [ref=f1e2054]: “Life for me ain’t been no crystal stair” is the opening line of a poem that my mother recited to me growing up. It speaks to the struggles I experienced growing up as a child of a single mother without my father’s involvement- physically, emotionally, or financially. She encouraged me to not let that hinder me from becoming a successful black male. Despite his absence, I am not, was, and will never be a statistic. I believe in myself. I have worked extra hard to maintain a high academic standard so that I can enroll in my college of choice. I have the “courage to grow” because I see where kids like me end up without an education.
                  - paragraph [ref=f1e2055]: I deserve this scholarship because I am prepared to make a difference in this world if I attain the proper education. I will give back to my community and inspire kids like me to grow. This scholarship will help me to realize my dream of becoming an engineer so that I can earn a decent living and not have to depend on anyone or the system for survival. I will be the recipient in which you will be most proud to share my success because of your support. I am the only male in my family to ever go to college. Therefore, you will help me start a generational tradition by helping me to reach my goal of attending college with this special scholarship. Obtaining a college degree is priceless for me.
                  - paragraph [ref=f1e2056]: B. McMillon
          - generic [ref=f1e2060]:
            - generic "Smart Headings" [ref=f1e2063]:
              - generic [ref=f1e2065]:
                - heading "L.Guerra July 2018" [level=2] [ref=f1e2067]
                - generic [ref=f1e2068]:
                  - paragraph [ref=f1e2069]: When I was little I loved the tidepools. My friends and I ran along the beach, past people sprawled beneath vibrant umbrellas, as the fine sand turned to bulky rocks beneath our feet. The ocean was a place of mystery, a bottomless, uncertain expanse limited only by the depth of human ambition. It was ambiguous. The tidepools represented that same ambiguity, broken down into child sized portions. As I excitedly hunted through one pool for seashells and starfish, I would notice other pools, each with new creatures and potential. I would follow this meandering path for hours, alone but for the ocean and my innocence.
                  - paragraph [ref=f1e2070]: Such is the prevalent human attitude toward ambiguity. We start with one path, one idea, and inevitably unearth a veritable ocean of alternatives and extrapolations, so enamored are we with the notion of something left intentionally unclear, uncertain with the intent of discovery. We find by searching, and search by finding. Humanity improves as ideas and their subsequent paths are investigated. This is natural. We must encourage searching just to search, discovering just to discover. We must accept ambiguity, appreciate curiosity, looking no further than our own minds for justification to love, to invent, to discover, to destroy.
                  - paragraph [ref=f1e2071]: As an aspiring writer, I am this ambiguity personified. I deserve this scholarship because through language, storytelling, empathy, and persistence I demonstrate possibility. I mesh various disciplines and force consideration of their combined outcome. I hope to facilitate the advancement of human society as only curiosity can.
                  - paragraph [ref=f1e2072]: L.Guerra
            - generic "Photo" [ref=f1e2075]:
              - figure [ref=f1e2077]:
