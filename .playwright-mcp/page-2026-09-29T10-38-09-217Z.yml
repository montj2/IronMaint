                - generic [ref=f1e227]:
                  - paragraph [ref=f1e228]: “She believed she could, so she did”
                  - paragraph [ref=f1e229]: My everlasting desire to accomplish the seemingly impossible to better myself for my future is due to my belief in these seven words–originating from my bathroom. There, a stout lonely book is displayed on the shelf near the window. The seven eloquent words of the title fulfill my soul so completely that I feel no further urge in my bones to flip the cover. The seven bright carmine letters are ingrained and sewn into my being that I embody it everyday subconsciously; a constant reminder to always put my best foot forward.
                  - paragraph [ref=f1e230]: Whether academic, personal, or community oriented, I am a believer in the idea that I can make a difference for others’ benefit. I have an addiction to fostering human connection. I have an addiction to compete against my own best self in school, community work, and group projects. I don't have goals. Goals spark tunnel vision. “Goals” insinuate the idea that something “will happen”. My approach to bettering humanity is constant; a “happening” instead of “will happen”. Not goals, but fibers of my being. Ultimately, I want to be a visionary for holistic human health, fueling others to become higher versions of themselves. My sights for my future don’t decline or dim when faced with adversity, in actuality it blossoms–because I invariably believe that I can.
                  - paragraph [ref=f1e231]: N. McFeat
          - generic [ref=f1e235]:
            - generic "Smart Headings" [ref=f1e238]:
              - generic [ref=f1e240]:
                - heading "R. Cunningham November 2024" [level=2] [ref=f1e242]:
                  - generic [ref=f1e243]: R. Cunningham
                  - generic [ref=f1e244]: November 2024
                - generic [ref=f1e246]:
                  - paragraph [ref=f1e247]: In large part, I am still the same person I was five or ten years ago. I am still driven by a desire to help others, I still love to learn, and I still love to experiment with ideas. The core of what I am is in large part constant. However, looking back, there is a sense that I have changed drastically. Growth, to me, has not been a big event. I have not experienced the one moment that completely reshapes my world view. For me, growth has been the development of nuance. It is what develops when I debate topics with my friends and classmates, when I am exposed to a new worldview, or when I face a difficult challenge. Even writing this essay, I have found room to grow. It helped me better understand how growth does not need to be a set of big events that mark unequivocal change, but can be something that happens bit by bit over a lifespan. That constant process of refining my perspectives and the courage to keep challenging myself so I have the environment to grow as a person, in my opinion, is why I deserve the Courage to Grow Scholarship.
                  - paragraph [ref=f1e248]: Furthermore, I strongly believe that being awarded the Courage to Grow Scholarship would help give me the freedom to spend the time to grow from my educational journey instead of being concerned over financing said journey
                  - paragraph [ref=f1e249]: R. Cunningham
