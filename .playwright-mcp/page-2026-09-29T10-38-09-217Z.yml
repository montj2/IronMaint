            - generic "Smart Headings" [ref=f1e1192]:
              - generic [ref=f1e1194]:
                - heading "V.Lin August 2021" [level=2] [ref=f1e1196]
                - generic [ref=f1e1197]:
                  - paragraph [ref=f1e1198]: "Problem, design, create, discover. Life in the suburbs: questions coupled with lengthy car rides. In what ways can we encourage an environmentally friendly environment? How has climate change impacted coral reefs? How much of our body do we have control? It seems the more neuroscientists decipher the inner workings of the brain, the less power we seem to have on our bodies."
                  - paragraph [ref=f1e1199]: Participating in Project SEED and conducting two research projects, my experiences sparked curiosity to answer my many puzzling questions. The beauty of research is that you can never stop discovering something new. It is just so alluring; there is just so much of the world we have yet to understand and numerous unconventional discoveries to be made.
                  - paragraph [ref=f1e1200]: Environmental studies have always been a passion of mine. As a nature advocate, one of my research projects was on acid precipitation on trichome production. I hope to expand my research and develop ways to protect wildlife and the ecosystem.
                  - paragraph [ref=f1e1201]: Climate change has brought detrimental effects around the globe, and scientists try to develop alternative energy sources to slow down global warming. I want to be at the center of this movement of promoting environmental sustainability. With the scholarship, I hope to further my education and research on ecotoxicology to create an environmentally safe place for future generations.
                  - paragraph [ref=f1e1202]: V.Lin
          - generic [ref=f1e1206]:
            - generic "Smart Headings" [ref=f1e1209]:
              - generic [ref=f1e1211]:
                - heading "R.Sutton July 2021" [level=2] [ref=f1e1213]
                - generic [ref=f1e1214]:
                  - paragraph [ref=f1e1215]: "Growing up with divorced parents, finding a sense of HOME was always difficult for me. For years I lived in an abusive household I felt I could never escape. Fortunately, my grandma’s house became a safe haven for me, a place where I could detach from all the drama. I was soon inspired to create my first film, “Home”\x9d where I assembled different clips of my grandmother’s house and put them against a piano track. It was from this very film I realized I could translate life’s experiences into my art."
                  - paragraph [ref=f1e1216]: As I faced more challenges, I began to cling to my art more than ever. Frequently moving around, my family suffered to obtain financial stability. What transpired was a general feeling of uneasiness and severe anxiety. I created my film, “A Rose Grows” an ode to my evolving self-identity in response to a life I felt was constantly changing.
                  - paragraph [ref=f1e1217]: While my cognitive learning difficulties also proved to be an existing challenge, I was eager to fight for my academic success. In high school, I pushed myself to take AP classes and extracurriculars, and after lots of hard work, got into my dream school, NYU. I soon created my dance film, “Seeing Purple” which was about my struggle to overcome my learning difficulties and turn them into my superpowers.
                  - paragraph [ref=f1e1218]: Art is my HOME. I will continue to make meaningful work in the hopes that it will resonate with the world around me.
                  - paragraph [ref=f1e1219]: Thank you for your time and thoughtful consideration.
                  - paragraph [ref=f1e1220]: R.Sutton
