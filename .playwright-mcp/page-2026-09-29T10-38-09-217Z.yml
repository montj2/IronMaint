                  - generic [ref=f1e276]: October 2024
                - generic [ref=f1e278]:
                  - paragraph [ref=f1e279]: Since the age of five, I’ve been determined to become a veterinarian. If you asked me why before, I’d give the simple answer of, “because I like animals!”. Over the years, my goal has not waivered one bit, but my motive has transformed completely.
                  - paragraph [ref=f1e280]: My motive lies closely with what the meaning of courage is to me. The word itself can hold countless meanings- to be fearless, brave, to stand up when no one else will- but to me, I view courage from a different perspective. To be courageous is to be someone who wants to help others and who can make a change in this world for the better. With a clearer motive and view of my place in this world, I see that what I want to bring to this world is something worthy of the title ‘courageous’. To put it simply, I want to help people- but that sentence is more complex than one would think.
                  - paragraph [ref=f1e281]: As I work to become a veterinarian, I understand that by helping just one animal, I can help its owner as well. My passion isn’t simple ‘because I love animals’ anymore, but is about my commitment to aid, educate, and help both people and animals as much as I possibly can.
                  - paragraph [ref=f1e282]: The Courage to Grow Scholarship proposes the opportunity to make a difference in the lives of animals and their owners. With the proper education, I know I can protect and preserve countless lives—something I’ve always felt destined to do.
          - generic [ref=f1e286]:
            - generic "Smart Headings" [ref=f1e289]:
              - generic [ref=f1e291]:
                - heading "H. Ainom September 2024" [level=2] [ref=f1e293]:
                  - generic [ref=f1e294]: H. Ainom
                  - generic [ref=f1e295]: September 2024
                - generic [ref=f1e297]:
                  - paragraph [ref=f1e298]: I didn’t know how to spell the word beautiful until 5th grade. I just ignored the a for the first ten years on my life. Though one might think that I was just a slow learner, in reality, the complexities of the English language never applied to me until I came here as an immigrant when I was six years old.
                  - paragraph [ref=f1e299]: To me, courage is my parents, escaping from the grip of persecution they faced under a dictator’s rule. Courage is my people, who refuse to deny their religion, despite being jailed for decades because of it. As I approach this college journey, my goal is to find the courage to fight for those who don’t have a voice in the legal system. It would be a joy to reunite immigrant families and to mend the dysfunctional immigration system in America today.
                  - paragraph [ref=f1e300]: I believe that I have the power to help the legal systems in America to truly preserve human rights for ALL people. To me, that is the truest form of courage, for which activists advocate for with their lives. In order to accomplish my dreams I ask that I can fully embrace my education, and currently, my worries about tuition are limiting me from applying to all the colleges I dream of. That is why I believe I deserve this scholarship.
                  - paragraph [ref=f1e301]: H. Ainom
