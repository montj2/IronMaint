                - heading "O. Donney June 2021" [level=2] [ref=f1e1245]
                - generic [ref=f1e1246]:
                  - paragraph [ref=f1e1247]: One sentence.
                  - paragraph [ref=f1e1248]: I never thought that one sentence could cause such uncertainty and so many unpredictable variables in my life. I had my life planned out. The first step was to study abroad in college, graduate, and then do traveling work. Now things are different. That one sentence two months ago changed my life.
                  - paragraph [ref=f1e1249]: I...have metastatic breast cancer. She was in tears and kept repeating sorry over and over again. My world stopped. My mother. My role model. My best friend. My only parent is dying.
                  - paragraph [ref=f1e1250]: I asked the dreaded question, “How long?”
                  - paragraph [ref=f1e1251]: 5 years. I couldn’t breathe. No. A million thoughts ran through my head. The big one being college. With added medical bills, could we even pay for them? Should I take a permanent leave to spend the remaining time with my mom? What does she want to do? What am I supposed to do? Is there a book on this somewhere? How can I go back to school which is halfway across the country as my mother gets treatment? What is the right decision?
                  - paragraph [ref=f1e1252]: There is no right decision.
                  - paragraph [ref=f1e1253]: My mother has always wanted me to graduate college, so I want her to see me graduate. I need to stay strong. Reach inside, grab that courage and hold on as tight as I can. I am going to graduate and make her proud. Sometimes things are not easy, but that means the rewards are even greater.
                  - paragraph [ref=f1e1254]: O. Donney
          - generic [ref=f1e1258]:
            - generic "Smart Headings" [ref=f1e1261]:
              - generic [ref=f1e1263]:
                - heading "X. St. Hill May 2021" [level=2] [ref=f1e1265]
                - generic [ref=f1e1266]:
                  - paragraph [ref=f1e1267]: One of the most important aspects of leadership for me is the philosophy of “Think and Do” in which I actively work to serve the greater good. Last June, I got the opportunity to work for North Carolina News Daily, a local online newspaper.
                  - paragraph [ref=f1e1268]: George Floyd was murdered a few days before I began working. While this was not the first time a traumatizing event like this has happened, I couldn't help but feel shocked and scared during those 8 minutes and 46 seconds, and the days that followed. Soon after, the police killing of Rayshard Brooks was reported. As a young Black teen, my heart felt like it was sinking
                  - paragraph [ref=f1e1269]: Working for a newspaper, I didn’t feel right remaining silent about these atrocities. My boss felt the same. With her help, I was able to begin the most Meaningful project of my summer.
                  - paragraph [ref=f1e1270]: "Businesses struggled during the COVID-19 pandemic, I wanted to do something to support our Black community. Thus, my project began: creating a series of 6 articles, highlighting the diverse array of Black-owned businesses throughout North Carolina"
                  - paragraph [ref=f1e1271]: Although 2020 was filled with much despair, especially for the Black community, there were still positives, beacons of light in the darkness. I was one of those beacons of light. That fact alone was enough to lift my previously sunken heart, and my spirits.
                  - paragraph [ref=f1e1272]: As an aspiring engineer, I'm intent on creating solutions to solve global problems, including issues of inequality and racism. I'm going to make the world a better place, for everyone.
                  - paragraph [ref=f1e1273]: X. St Hill
