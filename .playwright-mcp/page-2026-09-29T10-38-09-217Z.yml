                - generic [ref=f1e66]:
                  - paragraph [ref=f1e67]: People often confuse fearlessness, bravery, and courage. Fearlessness is the absence of fear. The catching of that corn snake you know is harmless, because your mother is afraid of snakes. Bravery is standing your ground in front of a charging dog, spur of the moment, because your legs can take more damage than the little pup behind you. Courage, however, is something entirely different.Courage is being afraid. Feeling fear and pressing on despite it. Playing that violin solo in front of hundreds of people. Taking a walk as dusk approaches, clutching a can of pepper spray because you refuse to let fear steal the sunset from you. Learning that the tumor was not benign, and redoubling your efforts with school to be attractive to scholarship donors, because cancer treatment is expensive.Courage is applying to scholarship after scholarship and getting rejection after rejection. Having your story and goals deemed “unworthy,” yet still writing essays and submitting videos and asking your teachers for what feels like the thousandth recommendation letter, because you dare have ambition that goes beyond community college.Courage is writing this essay, knowing well that it may not see the light of day, but submitting it regardless because I will not let fear bury me in debt, stifle my aspirations, or mar the beauty of the sunset on my high school years.Courage is a way of doing. A way of being. Not everybody can be brave, but anyone can be courageous.
                  - paragraph [ref=f1e68]: H. Cain
          - generic [ref=f1e72]:
            - generic "Smart Headings" [ref=f1e75]:
