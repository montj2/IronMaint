                - heading "R. Yousuf December 2020" [level=2] [ref=f1e1391]
                - generic [ref=f1e1392]:
                  - paragraph [ref=f1e1393]: “Who am I?”This question stuck with me through the years, as I contemplated just what made me a unique individual. This past summer I finally cracked a piece of the puzzle to answer the above question by utilizing the idea of the courage to grow.
                  - paragraph [ref=f1e1394]: The entire world was thrown into the chaos of our current Pandemic merely a year ago. I was simply lost, with a loss of what seemingly was my comfortable routine. There was suddenly so much time to reflect on the world; and might I say that I was horrified.
                  - paragraph [ref=f1e1395]: The death of George Floyd was a cold awakening to the reality that racism was largely existent. I was living in such an idealistic world prior to actually taking the time to reflect on the state of the country I lived in. I could not simply stand by, it was time to take a step forward and change the world.
                  - paragraph [ref=f1e1396]: Courage is the ability to take that initial step, regardless of what emotions are holding you back. I used such courage to join a group of students to look at the state of equity in education at our high school. The courage it took to put my voice and the voice of my peers out into our world, was the catalyst. Not only did I take a step forward for change, but also a step that allowed me to realize I am someone who wants to be the change I want to see in the world.
                  - paragraph [ref=f1e1397]: R. Yousuf
          - generic [ref=f1e1401]:
            - generic "Smart Headings" [ref=f1e1404]:
              - generic [ref=f1e1406]:
                - heading "S. Evelyne November 2020" [level=2] [ref=f1e1408]
                - generic [ref=f1e1409]:
                  - paragraph [ref=f1e1410]: Daring greatly, I left my psychologically abusive husband of sixteen years. The outside world contained so much wonder that even when I succumbed to tears under the suffering of either my own family or the universe itself, I refused to stop believing that there was more to life than what experience had shown me.
                  - paragraph [ref=f1e1411]: Courage was a dimmer of a light inside of me, but hope kept whispering to my soul. Those echoes of hope breathed life to awaken me each day to push forward with tenacity. Ignorant, I had few ideas of what was beyond the brick walls of the home where I raised my children. I vowed to use every bit of energy to keep my children thriving.
                  - paragraph [ref=f1e1412]: I refused to walk away, but leaving with my children was not safe either. Divorce while recovering from a traumatic brain injury was audacious. Convinced that the abuse would someday stop, I stayed until it was undeniable that they too were being abused. But etched into my mind was the image of the gun he had purchased when I tried to leave ten years prior. Was leaving even possible?
                  - paragraph [ref=f1e1413]: Yes it was; in the middle of a brisk November night we escaped to my cousin’s house. I had forgotten what safety, or the semblance of it, had even felt like. My life continued to change; my voice grew stronger and louder. And then I took the most courageous step of all; I went back to college as a single mother.
                  - paragraph [ref=f1e1414]: S. Evelyne
            - generic "Photo" [ref=f1e1417]:
              - figure [ref=f1e1419]:
