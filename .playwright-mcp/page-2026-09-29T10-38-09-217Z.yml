              - generic [ref=f1e1077]:
                - heading "B. Thompson January 2022" [level=2] [ref=f1e1079]
                - paragraph [ref=f1e1081]: "Change. One word, six letters, but a million chances of opportunity. If you google the word four definitions will come up. “Make someone or something different. To alter or modify.” This simple definition turns an ordinary one syllable word into something to strive for. The world is constantly advancing with new technology being created, new ideologies being spread, and generations being evolved. I myself have never been one for change; the idea scares me. Yet it’s the fear that that simple word gives me, that encourages me to be the change I want to see. As a kid I always had the big dreams and life goals teachers instilled in our minds. Be a straight A student, be on time, strive for greatness, and when all else fails you try again. This simple mindset shaped me into the person I am today. The life altering events that have taken place over the past year are the reason that change is needed. Change in the system, change in society and most importantly change within ourselves. I would like to be that change. My goals are to become a criminal defense attorney and help those who have been wrongly convicted, or simply want to be heard. If awarded this scholarship I can assist those seeking help and mean something to the people and this world. The question: why do I believe I should be awarded this scholarship? The answer is a simple 6 letter word with a million chances."
