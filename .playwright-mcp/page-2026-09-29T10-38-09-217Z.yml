                - generic [ref=f1e120]:
                  - paragraph [ref=f1e121]: People often wish they could "go back in time" to fix mistakes or change painful moments. I've felt that way too, especially after being separated from my father when my grandma took custody of my siblings and I. I was angry, lost and trying to make sense of why life had to change so suddenly. Then, a little after I began to fully adjust, my father passed away in a car accident. Losing him shattered me and left me struggling to stay focused and motivated.Over time, though, I realized that his love, values, and lessons still lived within me. His memory became my drive to work harder, stay grounded, and keep moving forward no matter how hard things got. I learned to turn pain into purpose, to use my experiences as fuel to grow stronger and more determined.I believe I should be awarded this scholarship because I've proven that adversity can build character and motivation, not destroy it. My journey has taught me resilience, empathy, and a deep appreciation for opportunity. Education, to me, isn't just a goal, it's also a way to honor my father's memory and create a better future for myself and my family. This scholarship would not only support my education financially but also validate the strength, perseverance, and dedication I've built through every challenge I've faced.
                  - paragraph [ref=f1e122]: J. Mosquera
          - generic [ref=f1e126]:
            - generic "Smart Headings" [ref=f1e129]:
