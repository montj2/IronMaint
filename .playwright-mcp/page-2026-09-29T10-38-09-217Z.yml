                - generic [ref=f1e172]:
                  - paragraph [ref=f1e173]: I deserve this scholarship because I have been an awful student.
                  - paragraph [ref=f1e174]: I have failed a class and missed so much school that I was threatened with truancy.
                  - paragraph [ref=f1e175]: My teachers thought I didn’t care. My close ones thought my behavior made sense. Everyone left it at that.
                  - paragraph [ref=f1e176]: Growing up, I constantly witnessed abuse and addiction. My dad was absent; I depended on my mom, who suffered from alcoholism. As a teen, my life at home and mental state worsened. This all caused me to skip school a lot. I missed tests, assignments, and my grades fluctuated constantly.
                  - paragraph [ref=f1e177]: Again, this simply made sense and was left at that.
                  - paragraph [ref=f1e178]: "Over time, I have improved greatly despite my situation. I stopped skipping and did schoolwork early. I arranged rides and bus routes when my mom couldn’t take me to school. I have earned only A’s throughout high school and won several awards: a Golden Bear in Science, a Stauffer Scholarship for my 4.3 GPA, and the titles of Sealbearer and Distinguished Graduate."
                  - paragraph [ref=f1e179]: My mom has never given up on sobriety, inspiring me every day to fight for my goals.
                  - paragraph [ref=f1e180]: I am committed to UC Irvine to study criminology. I want to help people neglected by the criminal justice system. I have experienced being written off firsthand; this system often does this to victims. I want to give these underserved people my all.
                  - paragraph [ref=f1e181]: I can’t afford necessities like housing, as I am low-income. This scholarship will allow me to focus solely on my education.
                  - paragraph [ref=f1e182]: S. Sermeno
          - generic [ref=f1e186]:
            - generic "Smart Headings" [ref=f1e189]:
