            - generic "Smart Headings" [ref=f1e1435]:
              - generic [ref=f1e1437]:
                - heading "O. Todd October 2020" [level=2] [ref=f1e1439]
                - generic [ref=f1e1440]:
                  - paragraph [ref=f1e1441]: Today, I am someone who strives to embody the Courage to Grow but I did not always have courage. I feared judgment and let doubt, comparison and flaws stifle me for a period of time. Freshman year, my family moved twenty miles from the only house I knew. I went from a public charter school with uniforms and 3 hallways for grades K-8 to being at a large public high school with almost two thousand students.
                  - paragraph [ref=f1e1442]: I had attended my old school since kindergarten and knew names of the younger primary hall students. I quickly realized in high school that how you look and behave affects the number of friends you have, hangouts you’re invited to, and followers on social media. Every year, I became increasingly self-conscious. I didn’t want to rub anyone the wrong way or look silly by what I said or did, so I often said nothing and missed opportunities that I wish I hadn’t.
                  - paragraph [ref=f1e1443]: This time of COVID restrictions gave me the distance I needed to hear my authentic voice. As evidence of my courage to grow, I followed my passion for politics and started a club where we strive to close the age, race, and gender gap in voting, by changing the culture around it. With a college degree in political science, I want to continue to advocate for issues such as mass incarceration and healthcare equity. Growth takes the courage to face judgment, make mistakes, look awkward and trust that it is worth it.
                  - paragraph [ref=f1e1444]: O. Todd
          - generic [ref=f1e1448]:
            - generic "Smart Headings" [ref=f1e1451]:
              - generic [ref=f1e1453]:
                - heading "J. Jensen September 2020" [level=2] [ref=f1e1455]
                - generic [ref=f1e1456]:
                  - paragraph [ref=f1e1457]: “You’ll never make it through college". This statement, issued by my 11th-grade chemistry teacher, shook me to the core. I had always been the source of constant criticism due to my Attention Deficit Disorder, yet this denunciation was the catalyst for change in my life. Motivated by a newly discovered Me vs. The World mentality, I set out to quell the doubts placed in my mind by both teachers and acquaintances. I succeeded. My senior year was a milestone. I achieved high grades, made sports teams, participated in clubs, and improved my social life.
                  - paragraph [ref=f1e1458]: I should have been happy. I wasn’t.
                  - paragraph [ref=f1e1459]: It took me some time to understand why. I had for the past year, focused on ME. My doubts, my faults, my failings. I had been motivated to squash criticism about ME. This sole focus on myself had unknowingly made me miserable. I set out to change this. I volunteered at reading centers, I focused on my family, I made a goal to perform one charitable thing daily. I switched the focus from ME to OTHERS. I had the courage to grow. I want to help others grow as well. That is why I am attending college to become a licensed psychologist.
                  - paragraph [ref=f1e1460]: I am now happy. Yet, happiness doesn’t last. I still get sad. Worries plague my mind. The burdens of paying for my education haunt me. Yet through this new approach, I now have true joy. I’ve discovered that although happiness is fleeting, true joy lasts a lifetime.
                  - paragraph [ref=f1e1461]: J. Jensen
            - generic "Photo" [ref=f1e1464]:
