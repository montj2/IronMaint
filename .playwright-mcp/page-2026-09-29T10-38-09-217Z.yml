                  - paragraph [ref=f1e1975]: I can’t do it. I think to myself as I decide it’s easier to let what my professor said go, than to challenge her.
                  - paragraph [ref=f1e1976]: I can’t do it. I say as I know I should stand up to a classmate and tell them they shouldn’t be talking like that, but it’s easier to say nothing.
                  - paragraph [ref=f1e1977]: I can’t do it. I sigh, hearing of people who have changed history by standing for what they believe.
                  - paragraph [ref=f1e1978]: Courageous people don’t get enough credit. Do hard things? Stand up for what you believe? Contradict the majority because you are persuaded about what you know to be true? It’s great in theory, but it takes real strength of character to put it into practice. Courage is looking at your life, knowing you are where you are for a reason, and not being afraid to believe it. Courage is knowing that even when you don’t have the strength in yourself, you’re never alone. Courage, I have learned, takes practice, but it is worth the temporary discomfort.
                  - paragraph [ref=f1e1979]: Courage is deciding you can’t do something because it’s too hard, and then doing it anyway. Courage is taking a deep breath and saying, I can do it!!
                  - paragraph [ref=f1e1980]: A.Kazen
