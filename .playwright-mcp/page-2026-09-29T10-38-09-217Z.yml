              - generic [ref=f1e1296]:
                - heading "R. Guerra April 2021" [level=2] [ref=f1e1298]
                - generic [ref=f1e1299]:
                  - paragraph [ref=f1e1300]: Living in neighborhood full of gangs, drugs and poverty our chances at life didn’t seem to have the best outcomes. Most of our family was gang related and the lifestyle seemed normal at a young age. It was regular life and sooner than later it became normal to use alcohol/drugs, cause ruckus and have this mentality that was, what I now call, fogged and warped by fear. About 10 years later I found myself barely holding on to life.
                  - paragraph [ref=f1e1301]: As a mother, I was confused as to where, why or how did this happen. Something inside me sparked. I cannot describe what caused this shift in my life; it was peaceful, calm, and very accepting. It was an awareness of a presence of something bigger than this world. I started to look at my past life.
                  - paragraph [ref=f1e1302]: Looking for preconceived ideas that had formed in the life I lived for so long, I was seeing parts of my life that I had a chance to take action on and that time was right then and now. I was to either live with a fogged perception fueled by selfishness, fear and self-pity, or I could be selfless, brave, and confident. This change in perception gave me the ability to help others.
                  - paragraph [ref=f1e1303]: Today I mentor other women and show them what worked for me. I overcame my difficulties. I got accepted into the most competitive BSN program in my area and I’M GOING TO BE A NURSE!
                  - paragraph [ref=f1e1304]: R. Guerra
          - generic [ref=f1e1308]:
            - generic "Smart Headings" [ref=f1e1311]:
              - generic [ref=f1e1313]:
                - heading "T. Taylor March 2021" [level=2] [ref=f1e1315]
                - generic [ref=f1e1316]:
                  - paragraph [ref=f1e1317]: The first half of my childhood was spent in foster care due to domestic violence, extreme neglect, and sexual abuse. Fortunately, I was adopted at the age of nine. My adoptive family guided me through a very painful healing journey. Proudly, I can now say that I have come to dramatic levels of healing and can now use my painful past to help others. A deep determination has always been present, despite the fact that I easily could have become another statistic.
                  - paragraph [ref=f1e1318]: After healing from my trauma, I was determined to break misconceptions about those who have been in foster care. We are not broken, nor are we damaged. Early graduation from high school was my first step, followed by publishing my autobiography called “Shattered No More”; I have answered the call to share my story through public speaking to crowds of up to 2000 in order to provide hope.
                  - paragraph [ref=f1e1319]: My college journey has included a nearly perfect GPA of 3.96 and recognition through numerous awards. Unlike those adopted over the age of 12, I have no financial assistance for my education. Without financial assistance, achieving my goal of obtaining a Master’s in Counseling may be impossible. The name of this scholarship spoke to me as I believe I have exemplified the courage to grow and strive to help others do the same. Thank you for your consideration.
                  - paragraph [ref=f1e1320]: T. Taylor
