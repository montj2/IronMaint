                - generic [ref=f1e137]:
                  - paragraph [ref=f1e138]: On my very first day of elementary school, I wore a Superman suit under my clothes. I was anxious, scared, and unsure if I belonged. But that suit gave me the courage to show up.
                  - paragraph [ref=f1e139]: Superman has always captivated me. Not because he can shoot lasers out of his eyes, but because he lives between two worlds. He is from the fictional planet Krypton but was raised on Earth, and even when the world does not accept him, he still tries to do good. His character powerfully captures the idea of constantly being questioned, feared, or misunderstood simply because he’s different.
                  - paragraph [ref=f1e140]: As a Latino, I understand that feeling. I’ve seen how people make assumptions when they hear my name or notice my accent. Like this character, I’ve had to prove I belong in spaces that weren’t always built with me in mind. However, I don’t hide or conform; I embrace my differences because Superman helped me see the importance of living between cultures, languages, and perspectives, recognizing the strength that comes from complexity.
                  - paragraph [ref=f1e141]: This perspective drives my commitment to education and representation. I want to explore how identity shapes the way we learn, communicate, and solve problems. I believe diversity is more than simply fairness. It’s essential for innovation and progress.
                  - paragraph [ref=f1e142]: This scholarship would support my academic goals and my mission to uplift others who feel like they don’t fit in. Like the kid in the Superman suit, I’m ready to keep showing up with courage, complexity, and purpose.
                  - paragraph [ref=f1e143]: D. Arizpe
