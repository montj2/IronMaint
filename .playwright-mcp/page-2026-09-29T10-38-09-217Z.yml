            - generic "Smart Headings" [ref=f1e2093]:
              - generic [ref=f1e2095]:
                - heading "S.Larsen June 2018" [level=2] [ref=f1e2097]
                - generic [ref=f1e2098]:
                  - paragraph [ref=f1e2099]: Every horse I have met has taught me a new lesson, i.e., Calvin taught me that being different is okay, even if others want to reject you for it; Buddy, that if you focus too much on the past or the future, you will overlook the present (and end up running into a fence!); Rhett, that everyone has differing opinions, but it is how you approach an idea that matters, not the idea itself.
                  - paragraph [ref=f1e2100]: I cannot think of a time in my life when I wanted to be anything but a Veterinarian. The concept of helping animals captivated me from a young age, and although this remains my educational goal, over the years I have seen how horses can help people heal. Something I have, that others do not, is my barn, where I ride and volunteer with their equine-assisted therapy program. The nonjudgmental nature of horses and their ability to mirror the attitudes and behaviors of humans, helps individuals’ process their thoughts and emotions. When I ride anxious and tense, my horse becomes tense, obstinate, and moves much more slowly. To correct his behavior, I need to recognize and release my tension. I, too, want to empower others to understand and accept themselves as they are so they can build on their strengths and move beyond what holds them back. Working with animals has always been my passion, and your scholarship will help me in achieving my goals of healing animals and supporting the humans who love them.
                  - paragraph [ref=f1e2101]: S. Larsen
          - generic [ref=f1e2105]:
            - generic "Smart Headings" [ref=f1e2108]:
              - generic [ref=f1e2110]:
                - heading "L.Jackson May 2018" [level=2] [ref=f1e2112]
                - generic [ref=f1e2113]:
                  - paragraph [ref=f1e2114]: Amongst the bushes, dirt and trees of the world lies endless possibilities, different combinations of green. Lying somewhere beneath the dark soil of an orchard, grows an untamed sapling. A nascent stem straight from the earth’s bosom, its newness to the surface of the world gleans as it stares into the new light, the source of life the sun offers. Never before has this sapling ever sprung into a world so brand new, a world so fresh, like the familiar scent of the seeping morning dew. The rich patches of land are already taken. Although the orchard is frightening and uncharted, the sapling still courageously grows.
                  - paragraph [ref=f1e2115]: Like this sapling, I am venturing into unfamiliar territory, entering a whole new world, but I will not allow that to stunt my growth, as I wish to continue to grow in boldness and in confidence. With this scholarship, I’d be able to continue to focus on new ways to spark my own intellect and inspire those around me. I wish to one day grow to create my own ideas relative to the world and my story. Having a foundation, an opportunity as great as this one, would help me to continue to grow through and past the rough patches in my life, overcoming the mental, physical, and economic barriers of my environment. In order to grow, every seed, each sapling, an ordinary person like me, needs a sufficient beginning, a sufficient start. If I were awarded this scholarship, it’d be my courageous start.
                  - paragraph [ref=f1e2116]: L.Jackson
