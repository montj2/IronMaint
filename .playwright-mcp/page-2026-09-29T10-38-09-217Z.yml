            - generic "Smart Headings" [ref=f1e968]:
              - generic [ref=f1e970]:
                - heading "R. Rubio June 2022" [level=2] [ref=f1e972]
                - generic [ref=f1e973]:
                  - paragraph [ref=f1e974]: Growing up the color blue made me happy. I loved seeing the dazzling blue sky and sparkling oceans. When I furthered my studies of computer science in high school, I was hit by waves of discouragement no ocean could ever make. I had begun to constantly fail my coding exams, and was the “black sheep” of my classes. This made me feel inadequate as my male classmates always exceeded. The blue shining oceans no longer became something I would admire, but the sole reminder of where I stand as a woman in the IT world. I felt as though the degree of computer science was just as unreachable as the skies. My favorite color became something I disliked.
                  - paragraph [ref=f1e975]: Volunteering to teach kids in computer science, I saw my students’ eyes shine with anticipation when they solved their programming problems, including the imperfections they committed in their codes. The satisfaction they feel as they enjoy the moment of trial and error outweighed my discouragement. It reminded me of the anticipation of putting my ideas in the wind. It reminded me of creating change with every line of code I create on my blue laptop.
                  - paragraph [ref=f1e976]: Blue is me, I am blue. This scholarship would help me pursue my degree in data science at university. I want to increase female involvement in computer science and data science. Being the only female in my IT courses is not a definition of discouragement, but a message of courage and change for future generations to come.
                  - paragraph [ref=f1e977]: R. Rubio
