          - generic [ref=f1e1754]:
            - generic "Photo" [ref=f1e1757]:
              - figure [ref=f1e1759]:
                - img "A woman standing in front of some grass" [ref=f1e1761]
            - generic "Smart Headings" [ref=f1e1764]:
              - generic [ref=f1e1766]:
                - heading "E. Pan August 2019" [level=2] [ref=f1e1768]
                - generic [ref=f1e1769]:
                  - paragraph [ref=f1e1770]: As a child, I was constantly in awe of the interconnectedness of the universe. It was this feeling of childhood wonder that began my passion for physics and later motivated me to tutor others. I had never understood the appeal of teaching until I became a peer tutor. The shine in a student’s eyes when they finally understand a topic, the jumbled words as their brain moved faster than their mouth, the feeling of satisfaction when they tell me they notice a phenomenon in real life, all far outweighed the time and effort behind it.
                  - paragraph [ref=f1e1771]: Additionally, I hope to increase female participation in the sciences. I’ve only met a handful of female students who can say confidently that they want to pursue physics, or engineering, or math beyond high school. I promoted Women of Science in my school where we see more and more girls show the confidence and comfort to allow their excitement for science to truly show. I hope that I can spark change in the world by educating girls and prove traditional gender roles wrong.
                  - paragraph [ref=f1e1772]: It is important to give back what you have taken from the world, and I feel that it is my obligation to spread the insight that I have gained. In any case, to fulfill this goal, I must start by educating myself in order to educate others. I’d like to use this scholarship to experience a college education so that I can have the expertise to incite the same feeling in others.
                  - paragraph [ref=f1e1773]: E. Pan
          - generic [ref=f1e1777]:
            - generic "Smart Headings" [ref=f1e1780]:
              - generic [ref=f1e1782]:
                - heading "C. Strahan July 2019" [level=2] [ref=f1e1784]
                - generic [ref=f1e1785]:
                  - paragraph [ref=f1e1786]: There comes a time in everyone’s life when they have a breakthrough. After years of trying and failing, I picked myself back up again and realized my true passion.
                  - paragraph [ref=f1e1787]: I am in love with space. The empty cosmos that lies just outside of our reach. The millions and millions of miles of unlimited beauty. The drive for science fiction, exploration, and the ability to touch the stars. I want to go to school to see that infinite layer of beauty. I often find myself looking upwards to the sky and wondering what else is up there. More planets? Stars? Galaxies? People? Anything could be in space and I want to see it. Through researching, watching videos, and doing my own stargazing at night I discovered that aerospace engineering is my true calling. I never wanted to do anything more than create technology (space shuttles, spacesuits, satellites, rovers) to see beyond what humans can grasp. Human beings have set foot on the moon before and it can and will happen again through the future generation of star gazers such as myself. I might be young and naive but everyone has been at some point. If the world didn’t have young people chasing their dreams then we wouldn’t have the luxuries that we live with today. Human knowledge now expands outside the realm of possibilities.
                  - paragraph [ref=f1e1788]: Nothing is truly impossible without dreams and courage. With one vision in mind, I can change the world. All it takes is a little courage to grow.
                  - paragraph [ref=f1e1789]: C. Strahan
            - generic "Photo" [ref=f1e1792]:
              - figure [ref=f1e1794]:
                - img "A woman with glasses and braids smiles for the camera." [ref=f1e1796]
          - generic [ref=f1e1800]:
            - generic "Photo" [ref=f1e1803]:
              - figure [ref=f1e1805]:
