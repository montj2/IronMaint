                - heading "B. Welch October 2018" [level=2] [ref=f1e2005]
                - generic [ref=f1e2006]:
                  - paragraph [ref=f1e2007]: I believe I’m the right applicant for this scholarship because it was intended to help people find the courage to pursue higher education.
                  - paragraph [ref=f1e2008]: The story of my success in college is still unfolding, but it started with my family losing everything in the great recession of the late 2000’s. I was forced to forgo college and get regular jobs to pay for my living expenses. I decided to volunteer in my available free time while I worked on my character and formulated a precise life plan. My volunteer activities included disaster relief, drug abuse counseling and community betterment events.
                  - paragraph [ref=f1e2009]: After seven years of volunteering and seven thousand hours in total, I was able to determine the one passion that had never wavered. I dream to become a mechanical engineer with a focus in sustainability. I dream of enabling our society to live with clean energy. Someday, I believe I will help bring global warming to a halt. Upon resolving to return to college, I discovered there were Federal and State programs to help me. I was lucky to receive financial aid. While financial aid doesn’t take care all the costs of becoming a mechanical engineer, it has shown me that it is possible to find a way to my dream. That’s why I’m applying to this scholarship. The Courage to Grow Scholarship, if I’m lucky enough to receive it, will mean so much to me in my journey.
                  - paragraph [ref=f1e2010]: B. Welch
          - generic [ref=f1e2014]:
            - generic "Smart Headings" [ref=f1e2017]:
              - generic [ref=f1e2019]:
                - heading "J. McKeehan September 2018" [level=2] [ref=f1e2021]
                - generic [ref=f1e2022]:
                  - paragraph [ref=f1e2023]: I work with my hands, and create masterpieces out of cardboard and wood and spray paint. When I notice something others perceive as broken, replaceable, I see something that can be made into something new, beautiful, with purpose and life, not to be thrown into the massive overflowing wastes of buried garbage, but reused.
                  - paragraph [ref=f1e2024]: Last summer, I rode my bike to Ace Hardware, and came home with the top half of a fan, the rest broken off and the fan going to be thrown away. In a shower of sawdust, sappy wood glue and a shiny saw gifted by my grandpa, I transformed this rejected piece of plastic into a useful fan with a sturdy wooden windmill base. My new loyal helper kept me cool and content throughout the blasted hot days of other summer projects.
                  - paragraph [ref=f1e2025]: I have had the courage, time and time again, to challenge our community’s perception of object permanence and social stigma against touching an object labeled “trash”. We, as a whole, must continue to open our minds to see in a different light, more than a wasteful society.
                  - paragraph [ref=f1e2026]: If this scholarship were to be given to me, it would ensure my funds to go to a good college, because money for education is not something that I can always make out of scrap. When I grow up, I want to make a difference in this world.
                  - paragraph [ref=f1e2027]: J. McKeehan
