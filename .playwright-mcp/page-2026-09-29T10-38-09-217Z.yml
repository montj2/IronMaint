              - generic [ref=f1e1104]:
                - heading "D. Wydeven December 2021" [level=2] [ref=f1e1106]
                - generic [ref=f1e1107]:
                  - paragraph [ref=f1e1108]: The interpretations of what it means to grow courageously are endless. In my life, growth has meant becoming comfortable with the uncomfortable. This concept has changed my life. What I once was most uncomfortable with was being myself. I wandered middle and high school as a tall, skinny math nerd. I felt so irrelevant despite everyone, only literally, looking up to me. A defining moment occurred in 10th grade during my honors English class. I was selected to participate in our school’s Poetry Out Loud competition, a national competition on poetry annunciation. This meant I had to perform in front of a panel of judges and my classmates. Uncomfortable, sweaty, and nervous, I walked up to the auditorium stage with lights so bright I could barely see. I took a few deep breaths and performed as I practiced. I would go on to win third place in my school in that competition, but more importantly I found myself. I could accept myself, whether I liked poetry, math, or soccer. I would go on to lead my school’s National Honors Society, start on varsity soccer, and help 8th graders transition into high school through Link Crew. These experiences taught me that being uncomfortable is more valuable to me than being comfortable. Without uncomfort we will never grow, and without courage we will never face uncomfort. With this scholarship I will bravely face the uncomfortable transition into college, with the financial burden eased through Courage to Grow.
                  - paragraph [ref=f1e1109]: D. Wydeven
          - generic [ref=f1e1113]:
            - generic "Smart Headings" [ref=f1e1116]:
              - generic [ref=f1e1118]:
                - heading "A. Hernandez November 2021" [level=2] [ref=f1e1120]
                - generic [ref=f1e1121]:
                  - paragraph [ref=f1e1122]: As the first generation in my family to go to college, my parents have high expectations for me. It is hard trying to be perfect when I am far from it. Another thing being, they don’t believe in mental health. If I’m struggling, then I am expected to simply brush it off, and for the longest time that is what I did. Keeping all my emotions bottled up was very hard all throughout middle school and even some of high school. When I learned that it was okay to not be okay, I broke.
                  - paragraph [ref=f1e1123]: For the first time in probably ever, I was vulnerable. Being honest with myself on how I truly felt was a weird feeling but remarkably relieving. A big part of why my mental health was so terrible was the fact that I was expected to be perfect. Keeping up with grades, work, family, sports, and everything in between was hard and being expected to do everything right was even harder. Realizing that I don’t need to have a million things on my plate was refreshing. Learning how to be honest with myself helped me become a better person and helped me be happy.
                  - paragraph [ref=f1e1124]: As the oldest sibling, I want to pass down to my brothers that it’s normal to have these emotions. I need to show them that life can be amazing and beautiful. Life doesn’t have to be stressful all day every day.Life can be happy.
                  - paragraph [ref=f1e1125]: A.Hernandez
            - generic "Photo" [ref=f1e1128]:
