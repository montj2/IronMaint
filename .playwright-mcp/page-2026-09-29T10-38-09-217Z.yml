          - generic [ref=f1e2172]:
            - generic "Photo" [ref=f1e2175]:
              - figure [ref=f1e2177]:
                - img "A man in a suit and tie smiling for the camera." [ref=f1e2179]
            - generic "Smart Headings" [ref=f1e2182]:
              - generic [ref=f1e2184]:
                - heading "A. Appouh February 2018" [level=2] [ref=f1e2186]
                - generic [ref=f1e2187]:
                  - paragraph [ref=f1e2188]: Being born an African American in an impoverished neighborhood meant that my life was going to be tough from day one. When I was diagnosed and institutionalized with mental illness in my late teens, my life became unbearable. At a time when most young people are excitedly beginning their college careers; school, work, and my relationships with others all suffered. However, by learning to immerse myself in my studies and stay active in my community, I was able to find the courage to grow as a person and student. I seek to be a role model. Someone who helps students find the courage to grow so they can build the confidence and strength of character they need to overcome the obstacles and challenges they face.
                  - paragraph [ref=f1e2189]: While I have learned to manage my mental illness, I still struggle to pay for the ever‑rising cost of my education, as I intend to continue receiving advanced degrees. Receiving this scholarship will help alleviate some of my financial burdens so that I can pursue my goal of becoming a high school math teacher to transform the inner-city classroom. Through my education, I intend to make a lasting, positive impact on America’s youth as a teacher.
                  - paragraph [ref=f1e2190]: A.Appouh
          - generic [ref=f1e2194]:
            - generic "Smart Headings" [ref=f1e2197]:
              - generic [ref=f1e2199]:
                - heading "T. Andrews January 2018" [level=2] [ref=f1e2201]
                - generic [ref=f1e2202]:
                  - paragraph [ref=f1e2203]: I ruffled my brow in confusion as my mother’s sweet voice filled my four-year-old mind with a captivating tune. I mimicked the sounds I heard until my mindless babbling translated into the unfamiliar word “santoki”, which I later discovered to mean “mountain rabbit”, with the song telling of his journey up daunting mountain peaks.
                  - paragraph [ref=f1e2204]: That nursery rhyme was my first conscious encounter with my Korean culture and understanding my biracial identity. Being half Asian and half White, my childhood was filled with such diverse elements and values that my inquisitive, unprejudiced nature was always made present. I strived to educate myself on the topics, people, cultures, and ways of life with which I was unfamiliar. I listened intently to the stories of my diverse peers and keenly absorbed every lesson in the classroom. I discovered early on, that there’s so much I don’t know about this world, but my ignorance can so easily be dissolved through the pursuit of knowledge.
                  - paragraph [ref=f1e2205]: I perceive the world from such a unique viewpoint because it’s not just a single viewpoint; it’s a collection of all my experiences and perceptions. Akin to santoki’s fearlessness, my inquisitions and ambitions drive me to continue my trek against all barriers I encounter, as I find the answers to questions that are unknown to me, accomplish the feats I set out for myself, and find the actualities hidden under unfair stereotypes.
                  - paragraph [ref=f1e2206]: It is my diversity that strengthens me and allows me to find success in all of my endeavors.
                  - paragraph [ref=f1e2207]: T.Andrews
            - generic "Photo" [ref=f1e2210]:
              - figure [ref=f1e2212]:
                - img "A young woman with long black hair in front of a ceiling fan." [ref=f1e2214]
          - generic [ref=f1e2218]:
            - generic "Photo" [ref=f1e2221]:
              - figure [ref=f1e2223]:
                - img "A woman holding up her hand in front of a tree." [ref=f1e2225]
            - generic "Smart Headings" [ref=f1e2228]:
              - generic [ref=f1e2230]:
                - heading "C. Padron December 2017" [level=2] [ref=f1e2232]
                - generic [ref=f1e2233]:
                  - paragraph [ref=f1e2234]: My coping strategy is music, it is the one place that I can escape to fill my life with clarity. Lyrics I wrote, say “Her soul has become an abyss, her eyes are more dark every day, she has no more hope for the future, she’s wishing that her life would go away. And the pills are just a poison, they don’t seem to change her ways, and if anything I’ve noticed, she gets worse every day.” It’s ironic that writing such sad lyrics can heal our wounds, but it’s because of this pain, that I realize we need to experience sadness to truly be happy. When I write these lyrics I’m acknowledging the pain, which in turn is more healing than forcing a smile, and keeping my true emotions in the dark. Sadness, just like any other emotion deserves to be in the limelight.
                  - paragraph [ref=f1e2235]: Obstacles are moments of fear and sadness that we need to experience in order to become brave and grow as a person. Bravery wouldn’t exist without fear, just like success does not exist without failure. I learned to cope with the kaleidoscope of emotions by looking at obstacles as an opportunity to learn and live a fulfilling life. I am grateful for the challenges that God has put in my way to make the journey to success a kaleidoscope. After all, life is beautiful and kaleidoscope means beauty in Greek. The emotions sparked from failure make the path to success more intriguing and beautiful.
                  - paragraph [ref=f1e2236]: C. Padron
          - generic [ref=f1e2240]:
            - generic "Smart Headings" [ref=f1e2243]:
              - generic [ref=f1e2245]:
                - heading "B. Lopez November 2017" [level=2] [ref=f1e2247]
                - generic [ref=f1e2248]:
                  - paragraph [ref=f1e2249]: My life has not always given me certain opportunities that I feel would place me in an advantageous position. Education has always been a paramount goal in my household, but a proper education can be expensive. While growing up, I watched my parents struggle to give for me and my siblings, but their love and hard work always placed food on the table and clothes on our backs. They taught me that pressure makes diamonds, and that out of struggle, we can find out who we really are and what we can achieve in life. Through their actions, they have shown me that roses can grow from concrete, and all it takes is dedication, an iron will, and a hunger to better myself and the world that surrounds me. Acquiring the proper materials needed for school has time and time again proved to be a burden, but that burden has turned to a success. I have learned to think outside of the box to achieve certain goals, and that unorthodox mentality has helped me be successful on several different endeavors. My parents have worked extremely hard for me to be successful in life, and I want to prove to them and myself that hard work was not in vain. Being chosen for this scholarship will mean that my parents do not have to worry about my future education. It will also give me a great opportunity to finally help them and pursue my goals without any hesitation and financial struggles.
                  - paragraph [ref=f1e2250]: B. Lopez
            - generic "Photo" [ref=f1e2253]:
              - figure [ref=f1e2255]:
                - img "A woman standing under a tree on top of a hill." [ref=f1e2257]
          - generic [ref=f1e2261]:
            - generic "Photo" [ref=f1e2264]:
              - figure [ref=f1e2266]:
                - img "A man and his child standing in the dirt." [ref=f1e2268]
            - generic "Smart Headings" [ref=f1e2271]:
              - generic [ref=f1e2273]:
                - heading "S. Miller October 2017" [level=2] [ref=f1e2275]
                - generic [ref=f1e2276]:
                  - paragraph [ref=f1e2277]: Several months before my daughter’s first birthday I became a single father, during that time I had recently enrolled for my first term back in school. She is almost 3 now. I had no clue what I wanted to be in life but I knew taking initiative towards getting an education was the best thing I could do for us. It was terrifying at first, I felt like I was going in completely blind but remained stoic and determined.
                  - paragraph [ref=f1e2278]: I think one of my biggest struggles in life is just facing the fear of success straight in the eyes and tackling it head on. The doubts that we may have need to be set aside in order for success. I have had my struggles, but after this term I will have obtained my first degree and I will be moving forward to apply to nursing school this next fall. The struggles have been everything a person could imagine. Financial hardship, loss of jobs, stress of not getting good grades and the fears of being a subpar father have all been legitimate concerns of mine. I finally understand that in life when you attach your emotions to things you try to succeed at doing, it may hinder your ability to do your best. So I give it my all, keep going and remain neutral while understanding that through every tough circumstance everything will pass. Collateral beauty is all around. It is how you handle it that determines the outcome.
                  - paragraph [ref=f1e2279]: S. Miller
          - generic [ref=f1e2283]:
            - generic "Smart Headings" [ref=f1e2286]:
              - generic [ref=f1e2288]:
                - heading "K. Kubit September 2017" [level=2] [ref=f1e2290]
                - generic [ref=f1e2291]:
                  - paragraph [ref=f1e2292]: It's always been difficult for me to be myself.
                  - paragraph [ref=f1e2293]: I am, by nature, a sensitive person, and the opinions of other people frequently defined my choices in the past. I would do almost anything for the assurance that I was “liked”, but the affirmation I received was dependent solely on how much I adjusted myself to fit the expectations of others. So, I crafted a unique persona for each “friend” of mine, using their preferences to create the version of me that I thought they would appreciate most. The differences were slight; sometimes it was the switch between “Positive Kayleigh” and “Negative Kayleigh”. But I was never just “Kayleigh”. Never simply me.
                  - paragraph [ref=f1e2294]: For a long time, all of my relationships functioned like this. I felt fake, I felt like a fraud, and most of all I believed that if I were to drop the act and be myself, I would be shunned. Then one day, for reasons I still don't know, I suddenly recognized the truth; that I have worth. It was a novel idea, and I held onto it tightly, not wanting to lose the joy it gave me.
                  - paragraph [ref=f1e2295]: Since then, I've started each day with the goal of being true to who I really am. It's frightening for me to be honest with people, but I finally feel free. I know that I'm sufficient even without the approval of others, so I can live my life to the fullest. Now, I am myself, and confident enough to grow.
                  - paragraph [ref=f1e2296]: K. Kubit
            - generic "Photo" [ref=f1e2299]:
              - figure [ref=f1e2301]:
                - img "Smiling woman in floral dress leaning on railing" [ref=f1e2303]
          - generic [ref=f1e2307]:
            - generic "Photo" [ref=f1e2310]:
              - figure [ref=f1e2312]:
                - img "A woman in yellow dress smiling for the camera." [ref=f1e2314]
            - generic "Smart Headings" [ref=f1e2317]:
              - generic [ref=f1e2319]:
                - heading "J. Sansone August 2017" [level=2] [ref=f1e2321]
                - generic [ref=f1e2322]:
                  - paragraph [ref=f1e2323]: In high school I cared for my community in a therapy office. I was saving up for my first car when my mother and my stepmother were both diagnosed with breast cancer. I dreamed of healing the women in my life. Caring for others near and far. Only my mother gracefully recovered. This overwhelmingly uncomfortable pain woke me up to life.
                  - paragraph [ref=f1e2324]: As the breadwinner, my mother inspired my college endeavors. I pushed myself to live away in uncertainty. I earned good marks, taught yoga to nuns, joined cross-country, volunteered on community farms, and taught beekeeping and medicinal herb classes to college students through a small business I founded. I discovered that most people do not have the resources to live nourishing lifestyles. By listening, educating and guiding people I am a witness of dynamic growth. Again, I moved across country to serve at a honeybee sanctuary and teaching farm in Virginia. Students of all ages visited from around the world. The teachings and careful attention on each plant, animal, and human process taught me courage.
                  - paragraph [ref=f1e2325]: Just as the nurtured seed unfurls into a vibrant flower under the sun, a human too, transforms day after day. This constant cycle “birth and death, blooming and shriveling” is necessary in order to rejuvenate and give others the goodness from our hearts. Befriending our fears and humbly embracing the small joys requires a balance of expanding/contracting, succeeding/failing, being alone/together. Now as a student nurse I embody and support courageous growth for my patients.
                  - paragraph [ref=f1e2326]: Jamie Sansone
          - generic [ref=f1e2330]:
            - generic "Smart Headings" [ref=f1e2333]:
              - generic [ref=f1e2335]:
                - heading "R. Courtney July 2017" [level=2] [ref=f1e2337]
                - generic [ref=f1e2338]:
                  - paragraph [ref=f1e2339]: I am no different than anyone else on paper, perhaps. But in my mind, and looking at my life from the outside in, I am different. I became the man of my house at the age of six when my father suddenly passed away. As time went on, it became clear that growing up without a father would put many different stresses on my life, especially financial ones. It turns out that this loss and those challenges also made me appreciate every opportunity life offers. I have always tried to make things easier on my mother and sister, lessening any burdens before they overwhelm us. I worry about my sister the way I would imagine a father would worry. Helping my mom in even the simplest ways, has been a constant effort of mine. I have managed to balance family and school in a way that most kids my age would never understand due to the unique circumstances my family has had to face. I have worked several jobs to contribute as much as I can while maintaining a 3.69 GPA and extracurriculars. As college approaches, I want to do everything in my power to lessen any future financial burdens my education incurs. College has always been a must for me, and this Courage to Grow scholarship is the first step in the realization of my goals. I am proud of the kind of man I have become -- and I think my dad would be, too.
                  - paragraph [ref=f1e2340]: R. Courtney
