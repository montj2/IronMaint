                - heading "M. Soliman March 2026" [level=2] [ref=f1e79]:
                  - generic [ref=f1e80]: M. Soliman
                  - generic [ref=f1e81]: March 2026
                - generic [ref=f1e83]:
                  - paragraph [ref=f1e84]: If I have anything, it’s the courage to grow.
                  - paragraph [ref=f1e85]: Throughout high school, I’ve actively sought out opportunities for personal and professional growth, even when it was uncomfortable, public, or risky.
                  - paragraph [ref=f1e86]: In drama, I chose vulnerability over ego. I performed and sang in front of hundreds, accepted criticism, and allowed myself to be seen fully. It was not easy, but it made me a stronger actor and a more confident person.
                  - paragraph [ref=f1e87]: In science, growth required rejection and failure. I boldly cold-emailed dozens of professors who had no obligation to respond, prioritizing my development as a researcher over fear of being ignored. In the lab, I had the courage to fail. I asked questions, re-did experiments, and learned that growth comes from persistence, not perfection.
                  - paragraph [ref=f1e88]: In church, I spoke up to a priest about the exclusion of women from communion during their periods, despite cultural and personal discomfort. Advocating for change forced me to grow in conviction, leadership, and moral responsibility.
                  - paragraph [ref=f1e89]: In the podcast booth, I posed uncomfortable questions and led difficult conversations, learning that curiosity and the courage to challenge controversy lead to meaningful change. In Spanish Lab, a program I helped build, I stepped into leadership as a peer tutor, courageously strengthening my ability to uplift others.
                  - paragraph [ref=f1e90]: I have the courage to grow because I refuse to waste opportunity. I seek discomfort, take initiative without permission, and treat failure as instruction. This scholarship would support not just my education, but my commitment to growth in college—everywhere it’s possible.
                  - paragraph [ref=f1e91]: M. Soliman
