              - figure [ref=f1e626]:
                - img "Teen wearing sunglasses by waterfall overlook" [ref=f1e628]
            - generic "Smart Headings" [ref=f1e631]:
              - generic [ref=f1e633]:
                - heading "C. Levine August 2023" [level=2] [ref=f1e635]:
                  - generic [ref=f1e636]: C. Levine
                  - generic [ref=f1e637]: August 2023
                - generic [ref=f1e639]:
                  - paragraph [ref=f1e640]: "\"Do. Or do not. For there is no try\" (Yoda, The Empire Strikes Back). When I was eight years old I remember staring at the dazzling space battles and strange worlds found in the Star Wars universe. Finding interest only in the manner in which its originator spoke, I never considered the true meaning behind the phrase. Years later, I got to find out what this saying truly meant. Leaving middle school behind, I entered the crazy world of high school. I hardly knew who I was, let alone this new, strange world. The people were unknown, the teachers were unmet, and the building was unexplored. It was there that I began to struggle. A year later, once again going to a new school, I thought that I would have to repeat this painful process again. But this time, I would not do things with fear. I entered my new school with confidence, ready to take on new challenges. I was ready to find new friends, meet new teachers, and explore new buildings. I would not sit back afraid of the unknown. I would “do.” Maybe that's what the quote meant. To either act, or not, but certainly to avoid hesitation and fear. Whether it’s interstellar space battles, or just third period biology, we need to have confidence in ourselves. That's why I should be awarded this scholarship. I had the courage to not only grow into my environment, but to grow into who I am as a person."
                  - paragraph [ref=f1e641]: C. Levine
          - generic [ref=f1e645]:
            - generic "Smart Headings" [ref=f1e648]:
              - generic [ref=f1e650]:
                - heading "D. Naziri July 2023" [level=2] [ref=f1e652]:
                  - generic [ref=f1e653]: D. Naziri
                  - generic [ref=f1e654]: July 2023
                - generic [ref=f1e656]:
                  - paragraph [ref=f1e657]: In the boundless skies of my dreams, I see myself in the airplane’s cockpit, savoring another flawless landing of the Boeing 777-9, the world’s largest commercial aircraft, as a testament to my skilled piloting. Beyond the thrill of flying, airplanes also symbolize unparalleled freedom and liberation for me, which I aim to share with others.
                  - paragraph [ref=f1e658]: Similarly, I aspire to be a general surgeon, making a meaningful impact on people’s lives. Witnessing a surgeon delicately stitch a torn stomach on TV ignited a passion within me to be a guiding light for patients in their darkest movement. Another dream of mine is to contribute to finding a cure for cancer, and I’ve already started by contributing to cancer research during an internship.
                  - paragraph [ref=f1e659]: I’m committed to reaching both of my career goals since these dreams drive my unwavering determination to overcome the stereotypes and doubts that hinder me. In the male-dominated society that I come from, women are discouraged from becoming surgeons, and until recently, were banned from becoming pilots.
                  - paragraph [ref=f1e660]: The “Courage to Grow” scholarship will relieve the financial burden of obtaining a BS, MD, and commercial piloting certificate. This scholarship means more than financial aid; it signifies a community that believes in the potential of individuals to rise above societal limitations. With this scholarship, I hope to unlock my aspiration’s full potential and help other young girls find the courage to grow and follow their aspirations, contributing to a future where barriers are broken, and dreams know no bounds. D. Naziri
            - generic "Photo" [ref=f1e663]:
              - figure [ref=f1e665]:
                - img "Person in red hoodie near coastal hills" [ref=f1e667]
          - generic [ref=f1e671]:
            - generic "Photo" [ref=f1e674]:
              - figure [ref=f1e676]:
                - img "Close-up of young woman with gold necklace" [ref=f1e678]
            - generic "Smart Headings" [ref=f1e681]:
              - generic [ref=f1e683]:
                - heading "D.Villacorta June 2023" [level=1] [ref=f1e685]
                - paragraph [ref=f1e687]: Courage can sometimes be mistaken for lack of fear. Courage is something we all strive to develop for one reason or another, we find ourselves in a situation that calls for extraordinary strength and resolve, most of the time being forced into it. Courage isn't the lack of fear but rather, the strength to face such fears and transform survival into tenacity to be able to find a solution to the problems facing you. I have the confidence to say that I have courage, developed through the discipline of education as my lifeline during difficult situations, and also finding strength within me to use the knowledge to my advantage to overcome those overwhelming odds. Competing in a large school to become the top 15% of my class in order to alleviate the burden of financing my college education for my parents in a household of 5 took courage. Supporting my teachers and my classmates emotionally through a health crisis while also struggling with my own mental health at home took courage. Being a first-generation college student, obtaining a full scholarship, working part-time while studying full time commuting an hour away took courage. Losing that scholarship because of the unreliability of the school and having to reinvent my life again took courage. And coming to terms with who I am, and continuing to find resilience through knowledge gives me courage. Applying again despite fearing being let down again takes courage. Knowledge still gave me courage. D. Villacorta
          - generic [ref=f1e691]:
            - generic "Smart Headings" [ref=f1e694]:
              - generic [ref=f1e696]:
                - heading "L. Wright May 2023" [level=2] [ref=f1e698]:
                  - generic [ref=f1e699]: L. Wright
                  - generic [ref=f1e700]: May 2023
                - generic [ref=f1e702]:
                  - paragraph [ref=f1e703]: My name is Liam Wright and I am a member of the Eastern Band of Cherokee Indians. I will be graduating from Smoky Mountain High School in June 2023 and have a strong desire to achieve. I will achieve this by going to college and gaining an education for myself. I grew up on the Cherokee boundary which mirrors a Indian reservation, as the US government coins it. During my childhood I was exposed to the realities of poverty and substance abuse. I have made the decision to continue my education to prevent the cycle from repeating itself. I will be attending a two year technological degree at AB Tech in Asheville, NC. I will be working towards a degree in Automotive Technology and adjusting to life in the city. I have always dreamed of working in automotive technology and plan to one day own a car shop. I have been working in automotive since I was a young child and feel at home working with cars. The college I plan on attending is an hour drive from the Cherokee Boundary and I will use these funds with my transportation to and from class. I would like to thank you for this opportunity to express my excitement for college and desire to be accepted for this scholarship. This scholarship will help me in achieving the goals I have set for myself. It is not easy to share my life experiences, but I hope you will take my words into consideration.
                  - paragraph [ref=f1e704]: L. Wright
            - generic "Photo" [ref=f1e707]:
              - figure [ref=f1e709]:
                - img "Person in blue jacket beneath windswept pine" [ref=f1e711]
          - generic [ref=f1e715]:
            - generic "Photo" [ref=f1e718]:
              - figure [ref=f1e720]:
                - img "A woman with red lipstick looking out of the window." [ref=f1e722]
            - generic "Smart Headings" [ref=f1e725]:
              - generic [ref=f1e727]:
                - heading "G. Nogueira April 2023" [level=2] [ref=f1e729]
                - generic [ref=f1e730]:
                  - paragraph [ref=f1e731]: "It was 2011. I do not remember the date, exactly, nor the time, but I remember where I was. A white room, with black chairs organized by row, and that stage right in front of me– the one with the American flag on the right, and a black microphone stand on the left. Paintings of old men dressed in expensive suits stared down at me from the walls with their acrylic smiles. This day is one of my earliest memories: the day my mother was naturalized."
                  - paragraph [ref=f1e732]: Courage and education go hand-in-hand when you are a first generation American. In America, many people expect you to be a criminal or drug addict or teen mother when you are Latina. To have the knowledge of what people think of you because of your ethnicity and still have the courage to subvert their expectations, become educated, and grow into the best version of yourself is the goal of every ambitious minority, especially if you are a Latin-American woman. In Brazil– where my parents are from– so many girls like me do not even have the chance to be sitting at a computer and submitting scholarships, much less even thinking of college. I sit here from a place of privilege, and sometimes I wonder what things would be like if my parents never boarded that plane in October 2000. To me, earning this scholarship is to tell that little girl in the all-American room to be unapologetically fearless and ambitious about her future.G. Nogueira
          - generic [ref=f1e736]:
            - generic "Smart Headings" [ref=f1e739]:
              - generic [ref=f1e741]:
                - heading "S. Sanford March 2023" [level=2] [ref=f1e743]:
                  - generic [ref=f1e744]: S. Sanford
                  - generic [ref=f1e745]: March 2023
                - generic [ref=f1e747]:
                  - paragraph [ref=f1e748]: The courage to grow is an attribute awarded to those bold enough to face their demons, and smile in the act of doing so. Be it ourselves, our life situations, or our surroundings, there always seems to be a weight pulling like an anchor on a powerful ship.
                  - paragraph [ref=f1e749]: The anchor for me lies on the sandbar of chronic pain. For the last two years, there has been a constant worry about my spinal well-being. A beast that has not been tamed by expensive medical procedures, my injury pulled me out of numerous physical hobbies and eats away at me during simple pleasures like sitting down after a long day.
                  - paragraph [ref=f1e750]: For a moment, my days were completely bleak.
                  - paragraph [ref=f1e751]: Once I came to terms with my condition, though, I started to work harder than I ever had to before. “Not feeling like it” had to be cut from my life if I were to start seeing a real change in my abilities. I am proud of the personal therapy track I have devised for myself after the medical industry had given up on me, and am very hopeful for what this new adventure of college has in store.
                  - paragraph [ref=f1e752]: Fostering the courage within us to grow means no excuses. It means accepting the responsibility for what life has thrown at us and recognizing we have the power to deal with it and deal with it gallantly. It is through this recognition I feel I have earned the courage to grow scholarship.
                  - paragraph [ref=f1e753]: S. Sanford
            - generic "Photo" [ref=f1e756]:
              - figure [ref=f1e758]:
                - img "A man playing the saxophone in front of an instrument." [ref=f1e760]
          - generic [ref=f1e764]:
            - generic "Photo" [ref=f1e767]:
              - figure [ref=f1e769]:
                - img "A person standing in front of a window wearing glasses." [ref=f1e771]
            - generic "Smart Headings" [ref=f1e774]:
              - generic [ref=f1e776]:
                - heading "B. Webster February 2023" [level=2] [ref=f1e778]
                - generic [ref=f1e779]:
                  - paragraph [ref=f1e780]: As a young person living with dissociative identity disorder, I know confusion all too well. My life is viewed through the lens of not one, but many. Science has barely navigated the maze that is the human brain, but mine complicates things even further. Naturally, I’ve become an expert in getting lost.
                  - paragraph [ref=f1e781]: When I was officially diagnosed in 2020, I was certain it meant relief from my questions. But as time went on, I quickly realized that finding one answer did not mean the rest would magically unravel. Living with DID has taught me plenty, but still, the explanations I can provide are meager at best when compared to an ever-growing list of questions.
                  - paragraph [ref=f1e782]: However, when neural pathways slam their doors, perspective opens its windows. My brain is still a mystery, but the answers I’ve gotten concerning life have far exceeded what I thought I’d have at my young age. This has given me the courage to move forward, seeking the promise of growth like a light in a tunnel. I’m slowly learning not to panic when I'm lost, but instead to rejoice in the idea of mapping something new. Through my secondary education, I mean to further examine with more resources my unanswered questions, as well as shine a light on the path for those who follow behind in my future career as an educator. With the Courage to Grow, I choose to bring the world a few more answers than it had when I was put in it.
                  - paragraph [ref=f1e783]: B. Webster
          - generic [ref=f1e787]:
            - generic "Smart Headings" [ref=f1e790]:
              - generic [ref=f1e792]:
                - heading "E. Scott January 2023" [level=2] [ref=f1e794]:
                  - generic [ref=f1e795]: E. Scott
                  - generic [ref=f1e796]: January 2023
                - generic [ref=f1e798]:
                  - paragraph [ref=f1e799]: As the child of a multi-faith family, I grew up a satellite state in a “war of the worldviews”. During seventeen years of enmity and intolerance, I developed severe insecurity about my worth and feared parental disapproval. Instead of engaging with the central paradox of my family, I ran away from Faith, and I was left with none.
                  - paragraph [ref=f1e800]: Eventually, I found myself in a dark place where I didn’t want to be. I decided to change something. At that moment, I stopped running away, and I learned what courage is.
                  - paragraph [ref=f1e801]: Courage is acceptance. Courage is saying, “my life is imperfect. I am imperfect. I am worth it, flaws and all.” Courage is taking a deep breath and allowing life to be paradoxical. I accepted that not everything in life was under my control, and in doing so, I gained control over myself, my choices, and my faith.
                  - paragraph [ref=f1e802]: "Here’s what I have faith in today:"
                  - paragraph [ref=f1e803]: Divergent worldviews can coexist.Radical kindness is the way out of intolerance.The world gets better.
                  - paragraph [ref=f1e804]: I plan to study writing, philosophy, and communities in college so I can help others heal from their paradoxes. When I chose to allow for paradox, I gained control over my life. With the Courage to Grow Scholarship, I will gain control over my education. Just as I no longer relied on others for my worth, I will not rely on my family to pay for my education.
                  - paragraph [ref=f1e805]: Together, we’ll make the world better.
                  - paragraph [ref=f1e806]: Thank you for your consideration.
                  - paragraph [ref=f1e807]: E. Scott
            - generic "Photo" [ref=f1e810]:
              - figure [ref=f1e812]:
                - img "A man in a blue shirt and jacket standing on stage." [ref=f1e814]
          - generic [ref=f1e818]:
            - generic "Photo" [ref=f1e821]:
              - figure [ref=f1e823]:
                - img "Solitary figure leaning on curved pine" [ref=f1e825]
            - generic "Smart Headings" [ref=f1e828]:
              - generic [ref=f1e830]:
                - heading "S. Strausberg December 2022" [level=2] [ref=f1e832]
                - generic [ref=f1e833]:
                  - paragraph [ref=f1e834]: At nine, I had built my first program.
                  - paragraph [ref=f1e835]: Inspired by my dad’s work as a software engineer, I began programming at a young age, but it wasn’t until much later that I began to see it as a tool for change. In 2020, my dad was diagnosed with aphasia after a stroke. I built my dad a picture-based communication app, similar to iMessage, that replaces the QWERTY keyboard with a picture-based one. Using my project, my dad was able to connect directly with my aunts in California for the first time since his diagnosis.
                  - paragraph [ref=f1e836]: Text-to-speech, screen readers -- every day, I see how innovative software has the potential to make the world more accessible to people with disabilities. I strive to develop enabling technology that enhances standard of living within marginalized communities. From communication platforms to artificial sight, I want to be at the forefront of innovations in accessible technology.
                  - paragraph [ref=f1e837]: As a computer science major joining Cornell’s class of 2027, I will explore the ways in which different areas of computing are utilized to create accessible technology. The one thing that stands in my way is the cost of college tuition. With two terminally ill parents who were forced into an early retirement, the cost of education is an overwhelming burden. The Courage To Grow Scholarship will give me the tools to build a more inclusive world and help me give back to people like my parents.
                  - paragraph [ref=f1e838]: S. Strausberg
          - generic [ref=f1e842]:
            - generic "Smart Headings" [ref=f1e845]:
              - generic [ref=f1e847]:
                - heading "L. Diaz November 2022" [level=2] [ref=f1e849]:
                  - generic [ref=f1e850]: L. Diaz
                  - generic [ref=f1e851]: November 2022
                - generic [ref=f1e853]:
                  - paragraph [ref=f1e854]: I believe that I should be awarded this scholarship for not only my success in the classroom, but also for my eagerness to make a positive change in my community. I am from a small town in northwestern New Mexico named Gallup. Miyamura is my homeschool in which I participate in many extracurricular activities in, but I take classes in my school districts McKinley Academy program. Here, I take college courses at the University of New Mexico-Gallup campus. By the time I graduate high school, I will have not only straight A’s and a high school diploma, but two associates in business and liberal arts. Living in Gallup, I am part of the small amount of people who take their education seriously. Alcoholism, and drug abuse are problems prominent in people of all ages in Gallup. This has made homelessness a huge problem for people of a young age and on. With the funding from this scholarship, being one of the few people to leave the problematic small town of Gallup and seek a higher education will be even more possible. The funding will help me more now than ever as most of the money that was planned for my college fund has been used for my grandma’s hospital bill from having a liver transplant and as well as cancer. After college, I plan on returning to Gallup and other places like it to help with the fight against drugs and alcohol. Thank you for the consideration for this scholarship.
                  - paragraph [ref=f1e855]: L. Diaz
