              - generic [ref=f1e943]:
                - heading "Y. Shah July 2022" [level=2] [ref=f1e945]
                - paragraph [ref=f1e947]: "Hope: a four letter word that carries the power of a thousand seas. When everything slips through my fingers, and I feel lost, hope is the single flame that can carry me out of the darkness. As a girl from a long line of traditional families, many of my preceding family members don’t support someone like me having a higher education. Instead, girls my age are conditioned to simply marry. My mother escaped this traditional life with divorce, and I hope to break this tradition with hope. I always hoped to help others using my passion for science, but never knew how. As I matured, I learned that just because we close our eyes, doesn’t mean that the underprivileged disappear. Despite discouragement to pursue a future in healthcare from one side of my family, I remained on my path with hope the other side of my family gave. Today, with the power of hope, my goal has become more direct: I want to use my passion for science and the education I attain to help the underprivileged through healthcare, and most importantly, hope. As a member of a low-income family, I cannot afford college tuition as easily as others. I hope to use this scholarship money towards my college funds, pursuing a future in medicine, so I will one day be able to help underprivileged individuals and communities have greater access to healthcare. My dream is to return the hope I was lucky enough to receive, back to the world."
