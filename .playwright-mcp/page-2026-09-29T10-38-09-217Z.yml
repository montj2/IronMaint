              - generic [ref=f1e927]:
                - heading "J. Irabor August 2022" [level=2] [ref=f1e929]
                - generic [ref=f1e930]:
                  - paragraph [ref=f1e931]: I lost my Dad December 5th, 2021. It was my first semester in the University of Michigan-Dearborn and everything went downhill from there. I finished the semester with a 1.98 GPA and fell into depression.
                  - paragraph [ref=f1e932]: I realized my Dad wouldn't want my life to go on like this. He would want me to chase my dreams and to succeed. So, I began to work, each day and night to get my life back in order. To get my grades up and help the campus community grow. I am currently in my sophomore year with a CGPA of 3.4. I did that. I built myself back up and I hope my dad is proud. I still lack the financial resources since my Dad passed away but I've been working and trying my best to find scholarships to sponsor my education.
                  - paragraph [ref=f1e933]: When I get this scholarship, it will be a great addition to helping me make it through college. My goal is to start up a car manufacturing company, so that I can create jobs for people and better their lives while also contributing greatly to the technological development of our planet.
                  - paragraph [ref=f1e934]: J. Irabor
