              - generic [ref=f1e1718]:
                - heading "C. Bush October 2019" [level=2] [ref=f1e1720]
                - generic [ref=f1e1721]:
                  - paragraph [ref=f1e1722]: Shrimp, Shorty, Short-Stack - just a few “nicknames” given to me by classmates. Nevertheless, I set my mind to achieving great heights in other ways - ways that can’t be measured by a yardstick.
                  - paragraph [ref=f1e1723]: In spite of being picked on in school for my short stature, I was determined that I wouldn’t let it get to me. I excelled academically and began growing in my community. Although I am a high school senior and only 5 feet tall, I have “Courage to Grow” on the inside showing others a person is not only made of the outward appearance but also the heart. I demonstrate this as a Jr. Captain for Young Men of Valor, a program that focuses on young boys’; mental, physical, and spiritual growth. Many of the boys are physically taller than I am; however, I encourage them to grow up to be respectful and responsible young men. I am also an owner of an eBay business and a pianist at a center for disabled adults.
                  - paragraph [ref=f1e1724]: Helping others is not my only passion; I am very fascinated by technology. I plan to go to college for computer science and start a computer freelancing business, allowing me to work both in Corporate America and in the homes of our communities.
                  - paragraph [ref=f1e1725]: This scholarship will help me be a model for those to whom the world says, “You don’t measure up”; - so they too will have the “Courage to Grow”.
                  - paragraph [ref=f1e1726]: C. Bush
          - generic [ref=f1e1730]:
            - generic "Smart Headings" [ref=f1e1733]:
              - generic [ref=f1e1735]:
                - heading "P. Thomas September 2019" [level=2] [ref=f1e1737]
                - generic [ref=f1e1738]:
                  - paragraph [ref=f1e1739]: When imagining my strengths, talents and hobbies, I often see myself on a literal tree. A tall, gnarly tree sprawling in many different directions.
                  - paragraph [ref=f1e1740]: "When I look up, I see that my tallest branches tower many feet above, filled with lush, green leaves and forming a canopy to shadow the space below. These branches of my academia, flourishing since childhood, are much stronger and harbor much greater potential to produce fruit: becoming a doctor, a lawyer, an engineer. I can almost see this fruit springing from the branches."
                  - paragraph [ref=f1e1741]: However, I still find myself lingering below them, in their shadow, on a low hanging branch “ My Branch of Cinema”. It is sturdy and healthy, yet small. I have only known this new academia for a few years. I think, “It would be silly to stay on this branch and wait for it to grow fruit. I must do what will surely make money”. Though I cannot bring myself to climb to the canopy branches.
                  - paragraph [ref=f1e1742]: "Creating, innovating, presenting, entertaining. This branch, although new and young, harbors all of the things I love. The branches within my canopy, no matter how large they may grow, hold no passion. However, sticking to this path requires courage: courage to remain with this little branch, courage to help it and watch it grow and intertwine with the branches above until it bears the best fruit on my tree. I believe that this scholarship will help me to do just this."
                  - paragraph [ref=f1e1743]: P. Thomas
            - generic "Photo" [ref=f1e1746]:
