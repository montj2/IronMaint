                - img "Smiling young man with backpack near waterfall" [ref=f1e2347]
          - generic [ref=f1e2351]:
            - generic "Photo" [ref=f1e2354]:
              - figure [ref=f1e2356]:
                - img "A woman with long black hair smiles for the camera." [ref=f1e2358]
            - generic "Smart Headings" [ref=f1e2361]:
              - generic [ref=f1e2363]:
                - heading "M. Poquiz June 2017" [level=2] [ref=f1e2365]
                - generic [ref=f1e2366]:
                  - paragraph [ref=f1e2367]: I am obsessed with intricacy.
                  - paragraph [ref=f1e2368]: Compulsively, I attempt to tear apart the secrets of the natural world and understand them at their most basic level. This compulsion has expressed itself not only in my microbiology major but also in my art. My greatest pleasures- and frustrations- lie in attempting to capture details, both real and imagined. This delicate balance between my artistic flights of fantasy and my scientific search for the truth is a continuous exercise in discipline and decision making.
                  - paragraph [ref=f1e2369]: In microbiology, I have realized these organisms are forever shifting their infinite potentials into undiscovered frontiers. They reminded me so much of my own wild imaginings, yet were grounded in the realities of science. I could approach these limitless possibilities with the perspective of an artist and act upon them with the attitude of a scientist.
                  - paragraph [ref=f1e2370]: I deserve this scholarship because I can approach science from both a human and technical perspective. I have immersed myself in both sides and understand that the humanities and STEM fields must be altruistic towards one another in order for each to fully impact its respective field. Many science majors have been accused of forgetting the humanity that lies behind the hard facts of science when ironically; biology is the study of life. The finer points of our humanity are contained in the most infinitesimal of things, whether they be creatures or gestures, and I intend to catch every single one.
                  - paragraph [ref=f1e2371]: For I do not fear details.
                  - paragraph [ref=f1e2372]: I drown in them happily.
                  - paragraph [ref=f1e2373]: M.Poquiz
          - generic [ref=f1e2377]:
            - generic "Smart Headings" [ref=f1e2380]:
              - generic [ref=f1e2382]:
                - heading "M. BonHomme May 2017" [level=2] [ref=f1e2384]
                - generic [ref=f1e2385]:
                  - paragraph [ref=f1e2386]: When I was younger I never believed that I would have made it past the age of 13 alive. I witnessed the youth waste their life away on drugs, gambling, and violence. I didn't think I would grow up to go to high school, or a homecoming dance. College was an unknown concept to not only me but my whole family. As a first generation college student, I am terrified to enroll in college this fall. However, as I begin to think more and more about my future I realize that life isn't all bad. When I was younger the worst things in life came free to us, but I shouldn't think only bad things come to us.
                  - paragraph [ref=f1e2387]: My college acceptance freed my mind to become more open to seeing life in technicolor. I used to see life in black and white, but I now I see life in a happier light. I want to grow up to become X, Y, & Z. I am now seeing myself in the future as someone great. I need to be courageous for myself since no one else will be for me. It took me many years to have courage to now believe in my abilities and talent. I may be scared to be the first in my family to go to college, but I know it is exactly where I belong. I want to grow my intellectual capacity. I am ready to gain new perspectives in college and grow as a person.
                  - paragraph [ref=f1e2388]: M. Bonhomme
            - generic "Photo" [ref=f1e2391]:
              - figure [ref=f1e2393]:
                - img "A woman holding a bouquet of flowers in her hand." [ref=f1e2395]
          - generic [ref=f1e2399]:
            - generic "Photo" [ref=f1e2402]:
              - figure [ref=f1e2404]:
                - img "A woman in a black shirt is standing next to a wall" [ref=f1e2406]
            - generic "Smart Headings" [ref=f1e2409]:
              - generic [ref=f1e2411]:
                - heading "S. Sieden April 2017" [level=2] [ref=f1e2413]
                - generic [ref=f1e2414]:
                  - paragraph [ref=f1e2415]: Life is scary, let’s face it! When I was little, it was the monster in the closet, the dark. When I was in Elementary school it was the mean kid in my class, being picked last in gym class, the mean lunch lady. As I grew up, the scary things got much worse and much more real. It was fear of failure, fear of me, and fear of my future. Am I going to succeed? Am I making the right choices? Will my life be all that I dream it to be? And that’s when I learned the most important lesson ever. Life takes courage. Mountains of it!
                  - paragraph [ref=f1e2416]: "My Grandpa loved John Wayne! He always said, “Well, like the Duke always says, courage is being scared to death and saddling up anyway!”\x9d I always giggled when he said that. But he was right. There will always be something scary in life, always, but you have to climb that mountain, face that fear, and do what others may tell you that you can’t. Every day we have a chance to grow and become more of the person we want to become. Becoming those people is what will change our world. Facing this next chapter in my life makes that monster from years ago seem pretty harmless and in the dark I can now see the stars, so as I enter this next phase of my life, I’m scared to death, but I’m off to “saddle up anyway!”"
                  - paragraph [ref=f1e2417]: S. Sieden
          - generic [ref=f1e2421]:
            - generic "Smart Headings" [ref=f1e2424]:
              - generic [ref=f1e2426]:
                - heading "C. Reid March 2017" [level=2] [ref=f1e2428]
                - generic [ref=f1e2429]:
                  - paragraph [ref=f1e2430]: "Growth is a concept that is unpredictable and difficult to measure. It is a force that is unavoidable. Sometimes, the word “growth” brings images of cancerous cells and weeds from a garden to my mind. To me, growth is both painful and amazing. We are eventually presented these two options: to be swept away by a metaphorical river that sweeps the land like a natural disaster allowing change to plague us, or to lay our foundations like an oak tree that offers shade on a hot day choosing to grow from the change that affects us."
                  - paragraph [ref=f1e2431]: There are times when both choices have been utilized in my life. Every day, I am presented with the choice of how to view change and what to do with it. That choice each day requires courage. I choose to have courage to recognize myself as someone that will make room for improvement. Courage to be brave and sink my roots, rather than be swept away by a river of self-doubt. If my life were an oak tree, then that tree will be grafted and pruned time and time again. The roots of the tree will tell of the way I chose change and began to perceive the world differently. Those choices will reflect my courage because I will have to admit that the power to grow is always mine.
                  - paragraph [ref=f1e2432]: C. Reid
            - generic "Photo" [ref=f1e2435]:
              - figure [ref=f1e2437]:
                - img "A young man sitting on the beach smiling for the camera." [ref=f1e2439]
          - generic [ref=f1e2443]:
            - generic "Photo" [ref=f1e2446]:
              - figure [ref=f1e2448]:
                - img "A woman standing under a tree on top of a hill." [ref=f1e2450]
            - generic "Smart Headings" [ref=f1e2453]:
              - generic [ref=f1e2455]:
                - heading "R. Penaranda February 2017" [level=2] [ref=f1e2457]
                - generic [ref=f1e2458]:
                  - paragraph [ref=f1e2459]: Life is not easy for everyone, and opportunities are not equally distributed. Some have to work harder to achieve their goals. This is my case. Something I have learned from life is that challenges make one stronger. I have lived through many difficult situations and experienced many life challenges, but I overcame them all.
                  - paragraph [ref=f1e2460]: I learned from all the difficult moments; every part of my life taught me something, even my volunteer work or my fundraising labor. All of this taught me how to successfully work within a team. Working and striving to make positive changes in our society allowed me to be a positive role model. I want to continue to be an example for underrepresented communities. I am fully committed to community service and social justice. I work with Latin and African American youths as an advocate for higher academic achievement.
                  - paragraph [ref=f1e2461]: Living on my own without financial support has been challenging, this is why I want to get an exceptional college education. Education has always been my goal, I feel blessed to have the opportunity to attend Seattle University, a school that is dedicated to social service and to empower leaders for a just and humane world. Education is a rewarding experience that lasts a lifetime. I want to show underrepresented communities that we can work for change and with an education we can grow through adversity and succeed in life.
                  - paragraph [ref=f1e2462]: R. Penaranda
          - generic [ref=f1e2466]:
            - generic "Smart Headings" [ref=f1e2469]:
              - generic [ref=f1e2471]:
                - heading "S. Luehr January 2017" [level=2] [ref=f1e2473]
                - generic [ref=f1e2474]:
                  - paragraph [ref=f1e2475]: Courage comes from the willingness to stand apart. It is the embodiment of accepting your true self for who you are, regardless of what the world says. It is standing strong in your convictions, though the principles of this world urge you to bend; this is courage. Courage is striving for those dreams hoped for, even those dreams you still cannot see. Courage is having faith, though your goals and dreams seem temporarily out of reach. It compels you to disregard the sideways looks, the questioning glances, and the vengeful hatred that flashes in the eyes of many, as you continue to push forward toward the goal; this is courage. Courage is confronting your fear of the unknown, fear of failure, and fear of inadequacy. It is waking up each morning and daring fear to confront you. It is laughing in the face of fear and boldly stepping into a new world; this is courage. Courage is found in the person willing to defy normal existence in order to strive for more in life. It is defining who you are in our culture today, without feeling the need to apologize for your originality. While others waste away into oblivion, you press on, dedicated to the task of accomplishing wonders; this is courage. To live freely and to love passionately, this is courage. In all that I do and all that I am, I strive to be courageous.
                  - paragraph [ref=f1e2476]: S. Luehr
            - generic "Photo" [ref=f1e2479]:
              - figure [ref=f1e2481]:
                - img "A woman in purple shirt sitting on ground near flowers." [ref=f1e2483]
