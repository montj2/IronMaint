[package]
name = "ironmaint-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Per-job Git workspace manager with path confinement (PHASE-0B.md §18) and optimistic-concurrency WorkspaceRevision (PHASE-0B.md §32)."

[lints]
workspace = true

[dependencies]
ironmaint-adapter-api = { path = "../ironmaint-adapter-api" }
ironmaint-core = { path = "../ironmaint-core" }
ironmaint-store = { path = "../ironmaint-store" }
schemars = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["fs", "process"] }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
ironmaint-adapter-api = { path = "../ironmaint-adapter-api" }
ironmaint-store = { path = "../ironmaint-store" }
sha2 = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt"] }
