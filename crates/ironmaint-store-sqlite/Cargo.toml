[package]
name = "ironmaint-store-sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["James Montgomery <montj2@github.com>"]
description = "SQLite backend for IronMaintStore. Uses runtime SQL (sqlx::query / sqlx::query_as::<_,T>); does not use compile-time sqlx::query! macros because 0B's CI does not have a live database at build time. See README.md."
publish = false

[dependencies]
ironmaint-core = { path = "../ironmaint-core" }
ironmaint-evidence = { path = "../ironmaint-evidence" }
ironmaint-policy = { path = "../ironmaint-policy" }
ironmaint-state = { path = "../ironmaint-state" }
ironmaint-store = { path = "../ironmaint-store" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
fs2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json = { workspace = true }
time = { workspace = true, features = ["macros"] }
tempfile = { workspace = true }
url = { workspace = true }
ironmaint-state = { path = "../ironmaint-state" }
ironmaint-policy = { path = "../ironmaint-policy" }
ironmaint-evidence = { path = "../ironmaint-evidence" }
ironmaint-store = { path = "../ironmaint-store" }
