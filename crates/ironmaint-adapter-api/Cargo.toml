[package]
name = "ironmaint-adapter-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "DistributionAdapter trait and capability ports. The contract every distribution adapter implements."

[dependencies]
ironmaint-core = { path = "../ironmaint-core" }
ironmaint-evidence = { path = "../ironmaint-evidence" }
ironmaint-policy = { path = "../ironmaint-policy" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
debian-stub = { path = "../../adapters/debian-stub" }
fedora-stub = { path = "../../adapters/fedora-stub" }
# S3 (`doc/SEAM-VERIFICATION.md` §2/S3): the capability inventory
# compares what an adapter *plans* against the `ToolRegistry` the
# daemon's own tool set builds. Dev-only, and `verify-architecture`
# exempts dev-dependencies (xtask/src/architecture.rs:269), so the
# adapter layer does not gain a production edge on the executor
# layer -- which would be the wrong way round.
ironmaint-executor = { path = "../ironmaint-executor" }
ironmaint-testkit = { path = "../../crates/ironmaint-testkit" }
time = { workspace = true, features = ["macros"] }
url = { workspace = true }

[lints]
workspace = true
