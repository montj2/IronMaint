[package]
name = "ironmaint-artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Content-addressed SHA-256 artifact store with atomic writes and crash-safe parent fsync (PHASE-0B.md §12)."

[lints]
workspace = true

[dependencies]
ironmaint-core = { path = "../ironmaint-core" }
ironmaint-store = { path = "../ironmaint-store" }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tempfile = { workspace = true }
