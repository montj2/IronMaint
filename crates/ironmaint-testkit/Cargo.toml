[package]
name = "ironmaint-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Fakes, fixtures, the shared adapter conformance suite, and serialization round-trip tests."

[dependencies]
ironmaint-core = { path = "../ironmaint-core" }
ironmaint-evidence = { path = "../ironmaint-evidence" }
ironmaint-policy = { path = "../ironmaint-policy" }
ironmaint-state = { path = "../ironmaint-state" }
ironmaint-adapter-api = { path = "../ironmaint-adapter-api" }
ironmaint-executor = { path = "../ironmaint-executor" }
ironmaint-synthetic-tools = { path = "../ironmaint-synthetic-tools" }
ironmaint-runtime = { path = "../ironmaint-runtime" }
ironmaint-store = { path = "../ironmaint-store" }
serde_json = { workspace = true }
time = { workspace = true, features = ["macros"] }
url = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
ironmaint-artifacts = { path = "../ironmaint-artifacts" }
# The §101 acceptance scenario drives the real `SqliteStore` rather
# than the mock, because steps 4, 5 and 30 are about surviving a
# restart and a mock cannot be restarted. Allowed here (and already
# in `ironmaint-runtime`) by PHASE-0B.md §98: the test-support crate
# is not a production dependency direction.
ironmaint-store-sqlite = { path = "../ironmaint-store-sqlite" }
# The §101 acceptance scenario's MCP half (DoD #29) drives the same
# walk through `dispatch` and reads the store for the facts no tool
# exposes. It cannot live in `ironmaint-mcp`: §98.6 forbids that
# crate from depending on a store backend in *either* dependency
# kind, and "MCP must never bypass runtime" is a rule about the
# crate, not about whether the caller is a test. Allowed here for the
# same reason as the row above.
ironmaint-mcp = { path = "../ironmaint-mcp" }
ironmaint-workspace = { path = "../ironmaint-workspace" }
pretty_assertions = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt"] }
url = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true

[features]
integration = []

[[test]]
name = "acceptance_scenario"
path = "tests/acceptance_scenario.rs"
required-features = ["integration"]

[[test]]
name = "synthetic_e2e"
path = "tests/synthetic_e2e.rs"
required-features = ["integration"]

[[test]]
name = "mcp_acceptance_scenario"
path = "tests/mcp_acceptance_scenario.rs"
required-features = ["integration"]
