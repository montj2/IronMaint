[package]
name = "ironmaint-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "MCP tool surface for the IronMaint runtime (PHASE-0B.md §50-§53). Authenticated, Streamable HTTP on 127.0.0.1."

[lints]
workspace = true

[dependencies]
ironmaint-core = { path = "../ironmaint-core" }
ironmaint-evidence = { path = "../ironmaint-evidence" }
ironmaint-executor = { path = "../ironmaint-executor" }
ironmaint-policy = { path = "../ironmaint-policy" }
ironmaint-runtime = { path = "../ironmaint-runtime" }
ironmaint-store = { path = "../ironmaint-store" }
ironmaint-workspace = { path = "../ironmaint-workspace" }
axum = { workspace = true }
rmcp = { workspace = true }
time = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# `ToolCapabilityKey` lives in adapter-api and is needed to stand in
# for an adapter materialising a check (no MCP tool does this; that
# gap is recorded in doc/PHASE-0B-COMPLETION.md §16). Dev-only, so
# the production dependency graph is unchanged.
ironmaint-adapter-api = { path = "../ironmaint-adapter-api" }
ironmaint-testkit = { path = "../ironmaint-testkit" }
ironmaint-store = { path = "../ironmaint-store" }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tokio-util = { workspace = true }
tempfile = { workspace = true }
