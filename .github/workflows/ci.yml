# IronMaint CI — the §97 gate, and the container image set.
#
# The gate is `doc/phases/PHASE-0B.md` §97, verbatim except where noted below.
# The image job is `make -C containers verify`, which already existed and
# already had teeth; this job is thin on purpose.
#
# Runner: `ubuntu-24.04-arm`, native. Not a default. Spec §8 calls an emulated
# build "unusable for iteration" and §10 rules out amd64 as a first-class
# target, and the developer machine is arm64 — so a gate that runs somewhere
# else is testing a different machine than the one the code is written on.
# This is also what caught D-23: two images were x86_64 inside an arm64 label,
# which Docker Desktop's emulator hid and a native runner would not.

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# A new push to the same branch cancels the previous run. Without this, every
# push queues another full gate and the oldest — least relevant — result is
# the one that finishes last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------
  # The §97 gate. Fails the PR on fmt, clippy, tests, or any of the five
  # xtask verifiers.
  # ---------------------------------------------------------------------
  gate:
    name: §97 gate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The toolchain pin lives in rust-toolchain.toml, not here. This action
      # reads it, so the two cannot drift.
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # This is the actual speed lever, and it replaces the baked `target/`
      # that spec §4.2 originally asked for. See CONTAINER-IMAGES.md §12.1 for
      # why the image would have been the wrong place for it.
      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      # --locked on every cargo invocation. Cargo.lock is committed, and a
      # gate that silently resolves a different dependency graph than the one
      # under review is not testing the thing under review.
      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: unit tests
        run: cargo test --workspace --locked

      # NOTE: §97 writes these as `cargo xtask verify-…`. That does not work —
      # the workspace defines its own `xtask` crate but does not install the
      # `cargo-xtask` binary that provides the subcommand, so it fails with
      # `no such command: xtask`. `cargo run -p xtask --` is the working form
      # and is what CLAUDE.md documents. The spec is wrong here, not the code.
      - name: verify-architecture
        run: cargo run -p xtask -- verify-architecture

      - name: verify-schemas
        run: cargo run -p xtask -- verify-schemas

      - name: verify-migrations
        run: cargo run -p xtask -- verify-migrations

      - name: verify-mcp-schemas
        run: cargo run -p xtask -- verify-mcp-schemas

      - name: verify-seams
        run: cargo run -p xtask -- verify-seams

      # The `integration` feature is declared only in ironmaint-testkit, but
      # `--workspace --features integration` enables it wherever it is
      # declared. The narrower `-p ironmaint-testkit --features integration`
      # form runs the same three binaries; the workspace form is what §97
      # and CLAUDE.md specify, so that is what runs here.
      - name: integration tests
        run: cargo test --workspace --features integration --locked

  # ---------------------------------------------------------------------
  # The image set. Builds all six and runs all six smoke tests.
  # ---------------------------------------------------------------------
  images:
    name: container images
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          # Native only. No qemu step: §8 treats emulated builds as unusable,
          # and the Makefile's `build-multi` path (which does need emulation)
          # is a developer-machine concern, not a gate.
          driver-opts: |
            image=moby

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/buildkit
          key: buildkit-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            buildkit-${{ github.ref_name }}-

      # `make verify` is `build` + `smoke` over all six images and fails on
      # any non-zero exit. It runs from the repo root because the Makefile
      # resolves its build contexts with $(PWD).
      #
      # The Makefile passes IRONMAINT_EXPECT_ARCH into every smoke run, which
      # is what makes the architecture assertion fire. Without it each smoke
      # test prints SKIP and passes — the check that cannot fail.
      - name: Build and smoke all six images
        run: make -f containers/Makefile verify

      # `make verify` already fails on a bad smoke test, so this step should
      # never trip. It exists so that the thing CI produced is inspectable
      # afterwards, because "CI says the images are fine" and "here is the
      # architecture each one actually reports" are different claims.
      - name: Report built image architectures
        run: |
          set -euo pipefail
          for img in base workspace debian-tools fedora-tools agent fake-services; do
            declared=$(docker image inspect "ironmaint/$img:0.1" --format '{{.Architecture}}')
            actual=$(docker run --rm --platform linux/arm64 "ironmaint/$img:0.1" uname -m)
            printf '%-16s declared=%-6s actual=%s\n' "$img" "$declared" "$actual"
            [ "$actual" = "aarch64" ] || {
              echo "::error::$img is $actual, not aarch64 (D-23)"
              exit 1
            }
          done

  # ---------------------------------------------------------------------
  # Not a job, deliberately. Listed here so the absence is on the record
  # rather than looking like an oversight.
  #
  # - The mock buildroot and a real sbuild build (spec §9). Both need
  #   --privileged, both are minutes-to-tens-of-minutes, and STATUS.md's two
  #   day-one arm64 risks for mock and sbuild have still never been run.
  # - Multi-arch builds. Native arm64 only; see the job above.
  # - Publishing. Nothing is pushed and nothing is tagged.
  # - Branch protection on develop. The gate exists but is not yet required.
  # - The IronClaw end-to-end run (D-15). Spec §83 says CI must not depend
  #   on a paid external LLM; that run stays opt-in via
  #   IRONMAINT_E2E_IRONCLAW=1 and stays environment-blocked here.
  # ---------------------------------------------------------------------
