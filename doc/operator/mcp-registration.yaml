# Sample IronClaw extension manifest for the IronMaint MCP server.
#
# Phase 0B.7 / §95 of doc/phases/PHASE-0B.md.
# Install with:
#   ironclaw extension install doc/operator/mcp-registration.yaml
#   ironclaw extension activate ironmaint
#
# Manifest schema: reborn.extension_manifest.v3 (see
# doc/vendor/ironclaw/crates/extensions/ironclaw_extension_contracts for the
# canonical types).

api_version: reborn.extension_manifest.v3

metadata:
  name: ironmaint
  vendor: ironmaint
  description: >-
    Distribution-neutral package-maintenance control plane. Drives Debian
    and Fedora package maintenance from event detection through approval.
    Exposes the workflow driver as MCP tools over Streamable HTTP.
  version: 0.1.0

extensions:
  - name: ironmaint
    runtime: mcp
    endpoint: http://127.0.0.1:7341/mcp
    transport: streamable_http

    auth:
      # The token file is read by *the client* on each outbound call,
      # so editing it takes effect for new calls the next time
      # IronClaw dispatches. Note what it does NOT do: the server
      # reads the expected token once at startup, so rotating the
      # file does not revoke anything until ironmaintd is
      # restarted. To revoke a token, restart the daemon with a new
      # file. (The 0B.6 comment here claimed file rotation alone was
      # sufficient to invalidate every session; it is not.)
      kind: bearer
      bearer_token_file: ~/.config/ironmaint/token

    capabilities:
      tools:
        # Job lifecycle
        - job.create
        - job.get
        - job.next_actions
        - job.reconcile
        # Candidate handling
        - candidate.capture
        # Evidence / gate execution
        - check.run
        # Workspace
        - workspace.apply_patch
        - workspace.stat
        # Privileged operations
        - operation.get

    # The IronMaint MCP server is a local sidecar; no egress is
    # required beyond the loopback endpoint declared above. Egress
    # allowlist declared here is a no-op for streamable_http transport
    # but is set explicitly to document the intent for the audit log.
    egress:
      allowlist: ["127.0.0.1:7341"]

    # IronMaint maintains its own durable state. The agent must not
    # be granted any other host-side authority through this manifest.
    resources:
      scopes: []
      secrets: []

    # Health probe: the server is healthy if `initialize` returns 200
    # within 1 s. IronClaw uses this to decide when the extension is
    # ready to receive tool calls after activation. The probe must
    # send `accept: application/json, text/event-stream`; a request
    # offering only one of the two is answered 406 before it is ever
    # dispatched, and an unauthenticated probe is 401 (see
    # doc/operator/ironclaw-setup.md §1).
    healthcheck:
      method: initialize
      timeout_ms: 1000
